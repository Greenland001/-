<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms 3D — Level 0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#webgl-container{
  width:100%;
  height:100%;
  display:block;
}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:18px;
  background:rgba(28,26,17,.72);
  color:#eee;
  font-size:16px;
  backdrop-filter:blur(8px);
  text-align:center;
  max-width:85%;
  transition:opacity .8s;
}

.hint.hide{ opacity:0; }

/* Кнопка прыжка справа */
.jump-btn{
  pointer-events:auto;
  position:absolute;
  right:30px;
  bottom:30px;
  width:80px;
  height:80px;
  border:3px solid rgba(255,255,255,0.4);
  border-radius:50%;
  background:rgba(20,19,15,.75);
  color:white;
  font-size:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
}
.jump-btn:active{
  background:rgba(100,90,50,0.8);
  transform:scale(0.92);
}

.joy{
  pointer-events:auto;
  position:absolute;
  left:30px;
  bottom:30px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(28,27,23,.62);
  border:3px solid rgba(190,190,190,.55);
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(190,190,190,.9);
}

.crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.crosshair::before, .crosshair::after{
  content:'';
  position:absolute;
  background:rgba(255,255,255,.6);
}
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }

/* Экран с просьбой перевернуть телефон */
#rotate-screen{
  position:fixed;
  inset:0;
  background:#0e0d0a;
  color:#f0e6c2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999;
  text-align:center;
  padding:20px;
}
#rotate-screen .icon{
  font-size:60px;
  margin-bottom:15px;
  animation:rotateAnim 2s infinite ease-in-out;
}
@keyframes rotateAnim {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="rotate-screen">
  <div class="icon">🔄</div>
  <h2>Поверните устройство</h2>
  <p>Для удобной игры переверните телефон горизонтально</p>
</div>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">🕹️ Джойстик — ходить • Свайп справа — смотреть</div>
  <div class="crosshair"></div>
  <div id="jump" class="jump-btn">⬆</div>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

<script>
'use strict';

const map = [
  "############################",
  "#..........................#",
  "#..#####....#####....####..#",
  "#..#...#....#...#....#..#..#",
  "#..#...######...######..#..#",
  "#..#....................#..#",
  "#..######..######..######..#",
  "#.......#..#....#..#.......#",
  "#.......#..#....#..#.......#",
  "#..######..######..######..#",
  "#..#....................#..#",
  "#..#...######...######..#..#",
  "#..#...#....#...#....#..#..#",
  "#..#####....#####....####..#",
  "#..........................#",
  "#..######..######..######..#",
  "#..#....#..#....#..#....#..#",
  "#..#....#..#....#..#....#..#",
  "#..#....####....####....#..#",
  "#..........................#",
  "############################"
];

const MW = map[0].length;
const MH = map.length;
const CELL_SIZE = 3;

const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110e);
scene.fog = new THREE.FogExp2(0x11110e, 0.04);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0x999988, 1.0);
scene.add(ambientLight);

/* =========================
   ТЕКСТУРЫ И СВЕТ
========================= */
function createWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#c5b565';
  ctx.fillRect(0, 0, 256, 256);
  
  ctx.fillStyle = 'rgba(80,70,30,0.12)';
  for(let i=0; i<256; i+=16) ctx.fillRect(0, i, 256, 2);
  for(let i=0; i<400; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
    ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
  }

  let gradTop = ctx.createLinearGradient(0, 0, 0, 30);
  gradTop.addColorStop(0, 'rgba(0,0,0,0.35)');
  gradTop.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradTop;
  ctx.fillRect(0, 0, 256, 30);

  let gradBot = ctx.createLinearGradient(0, 226, 0, 256);
  gradBot.addColorStop(0, 'rgba(0,0,0,0)');
  gradBot.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = gradBot;
  ctx.fillRect(0, 226, 256, 30);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

function createCarpetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#635936';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = 'rgba(30,25,10,0.2)';
  for(let i=0; i<300; i++) ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW * 2, MH * 2);
  return texture;
}

function createCeilingTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#8f886b';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#57523c';
  ctx.lineWidth = 5;
  ctx.strokeRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW, MH);
  return texture;
}

function createGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255, 255, 210, 0.6)');
  grad.addColorStop(0.4, 'rgba(255, 240, 160, 0.2)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

/* =========================
   ПОСТРОЕНИЕ МИРА
========================= */
const wallMat = new THREE.MeshLambertMaterial({ map: createWallTexture() });
const floorMat = new THREE.MeshLambertMaterial({ map: createCarpetTexture() });
const ceilingMat = new THREE.MeshLambertMaterial({ map: createCeilingTexture() });

const floorGeo = new THREE.PlaneGeometry(MW * CELL_SIZE, MH * CELL_SIZE);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set((MW * CELL_SIZE)/2, 0, (MH * CELL_SIZE)/2);
scene.add(floor);

const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set((MW * CELL_SIZE)/2, 3, (MH * CELL_SIZE)/2);
scene.add(ceiling);

const wallGeo = new THREE.BoxGeometry(CELL_SIZE, 3, CELL_SIZE);
const lampGeo = new THREE.BoxGeometry(1.2, 0.05, 0.6);
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

const glowMat = new THREE.MeshBasicMaterial({
  map: createGlowTexture(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glowGeo = new THREE.PlaneGeometry(3.5, 3.5);

const walls = [];

for (let y = 0; y < MH; y++) {
  for (let x = 0; x < MW; x++) {
    const posX = x * CELL_SIZE + CELL_SIZE/2;
    const posZ = y * CELL_SIZE + CELL_SIZE/2;

    if (map[y][x] === '#') {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(posX, 1.5, posZ);
      scene.add(wall);
      walls.push(wall);
    } else {
      if ((x + y) % 3 === 0) {
        const lamp = new THREE.Mesh(lampGeo, lampMat);
        lamp.position.set(posX, 2.97, posZ);
        scene.add(lamp);

        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.rotation.x = Math.PI / 2;
        glow.position.set(posX, 2.94, posZ);
        scene.add(glow);
      }
    }
  }
}

camera.position.set(2.5 * CELL_SIZE, 1.5, 2.5 * CELL_SIZE);

/* =========================
   УПРАВЛЕНИЕ, ФИЗИКА И ПРЫЖОК
========================= */
let moveX = 0, moveY = 0;
let yaw = 0, pitch = 0;

// Переменные для прыжка
let playerY = 1.5;
let velocityY = 0;
const gravity = -18;
const jumpForce = 6.5;
let isGrounded = true;

function checkCollision(newPos) {
  const radius = 0.4;
  for (let wall of walls) {
    const box = new THREE.Box3().setFromObject(wall);
    const playerBox = new THREE.Box3(
      new THREE.Vector3(newPos.x - radius, 0, newPos.z - radius),
      new THREE.Vector3(newPos.x + radius, 3, newPos.z + radius)
    );
    if (box.intersectsBox(playerBox)) return true;
  }
  return false;
}

function updatePlayer(dt) {
  // Обработка прыжка и гравитации
  velocityY += gravity * dt;
  playerY += velocityY * dt;

  if (playerY <= 1.5) {
    playerY = 1.5;
    velocityY = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }

  // Ограничение по высоте потолка
  if (playerY > 2.4) {
    playerY = 2.4;
    velocityY = 0;
  }

  camera.position.y = playerY;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const speed = 4.0 * dt;
  const dir = new THREE.Vector3();
  
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  dir.addScaledVector(forward, -moveY);
  dir.addScaledVector(side, moveX);
  
  if (dir.length() > 0) dir.normalize();

  const nextPosX = camera.position.clone().addScaledVector(new THREE.Vector3(dir.x, 0, 0), speed);
  if (!checkCollision(nextPosX)) camera.position.x = nextPosX.x;

  const nextPosZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, dir.z), speed);
  if (!checkCollision(nextPosZ)) camera.position.z = nextPosZ.z;
}

/* =========================
   ТАЧ-СОБЫТИЯ I КНОПКА ПРЫЖКА
========================= */
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const jumpBtn = document.getElementById('jump');

let joyId = null, joyRect = null;
let lookId = null, lastTouchX = 0, lastTouchY = 0;

// Событие прыжка
jumpBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (isGrounded) {
    velocityY = jumpForce;
    isGrounded = false;
  }
});

joy.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joy.setPointerCapture(joyId);
  joyRect = joy.getBoundingClientRect();
  updateJoy(e);
});

joy.addEventListener('pointermove', e => {
  if (e.pointerId === joyId) updateJoy(e);
});

function updateJoy(e) {
  let dx = e.clientX - (joyRect.left + joyRect.width/2);
  let dy = e.clientY - (joyRect.top + joyRect.height/2);
  const max = joyRect.width * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx / max;
  moveY = dy / max;
}

function resetJoy() {
  joyId = null; moveX = 0; moveY = 0;
  knob.style.transform = 'translate(-50%, -50%)';
}
joy.addEventListener('pointerup', resetJoy);
joy.addEventListener('pointercancel', resetJoy);

window.addEventListener('pointerdown', e => {
  if (e.target === joy || joy.contains(e.target) || e.target === jumpBtn) return;
  if (e.clientX > window.innerWidth * 0.3) {
    lookId = e.pointerId;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === lookId) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;

    yaw -= dx * 0.004;
    pitch -= dy * 0.004;
    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  }
});

window.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

/* =========================
   ПРОВЕРКА ОРИЕНТАЦИИ ЭКРАНА
========================= */
function checkOrientation() {
  const rotateScreen = document.getElementById('rotate-screen');
  if (window.innerHeight > window.innerWidth) {
    rotateScreen.style.display = 'flex';
  } else {
    rotateScreen.style.display = 'none';
  }
}

window.addEventListener('resize', () => {
  checkOrientation();
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

checkOrientation();

/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */
let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  updatePlayer(dt);
  renderer.render(scene, camera);

  requestAnimationFrame(animate);
}

setTimeout(() => document.getElementById('hint').classList.add('hide'), 4000);

requestAnimationFrame(animate);
</script>
</body>
</html>
