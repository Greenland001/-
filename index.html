<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кинито Пет</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Tahoma,"Trebuchet MS",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#pc{position:fixed;inset:0;overflow:hidden;background:
radial-gradient(ellipse 12% 7% at 22% 20%,#fff 0 40%,transparent 70%),
radial-gradient(ellipse 14% 7% at 62% 14%,#fff 0 40%,transparent 70%),
radial-gradient(ellipse 130% 55% at 25% 108%,#56a82a 0 58%,transparent 59%),
radial-gradient(ellipse 100% 42% at 95% 112%,#3f8a1a 0 60%,transparent 61%),
linear-gradient(#2a6bd8,#9fd0f7 68%)}
#icons{position:absolute;left:3px;top:4px;bottom:34px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start}
.ic{width:62px;text-align:center;color:#fff;font:11px Tahoma,sans-serif;text-shadow:1px 1px 2px #000;background:none;border:0;padding:2px;border-radius:3px;cursor:pointer}
.ic span{display:block;font-size:22px;line-height:26px}
.ic:active,.ic:focus-visible{background:rgba(49,106,197,.65);outline:1px dotted #fff}
#kin{position:absolute;left:50%;top:40%;width:49px;height:105px;z-index:8;cursor:grab;touch-action:none}
#kin>svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%;animation:float 3.4s ease-in-out infinite}
#kin.walk>svg{animation:fly .9s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes fly{50%{transform:translateY(-5px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){#kin>svg,#kin.walk>svg{animation:none}}
#bub{display:none;position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(230px,44vw);background:#fff5cf;color:#111;border:2px solid #222;border-radius:10px;padding:6px 9px;font:italic 11px/1.35 "Courier New",monospace;text-align:left;transform-origin:50% 100%;pointer-events:none}
#bub::after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top:10px solid #222;border-bottom:0}
#bub.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.win{display:none;flex-direction:column;position:absolute;background:#f4f3ee;border:2px outset #d4d0c8;box-shadow:3px 3px 0 rgba(0,0,0,.35);color:#000;z-index:4;font-size:12px}
#w-ans{left:50%;transform:translateX(-50%);bottom:34px;width:min(400px,88vw)}
.big{left:70px;top:6px;bottom:34px;width:min(520px,calc(100% - 160px))}
.tb{background:linear-gradient(90deg,#7b7b48,#a9a96b);color:#fff;font-weight:700;padding:2px 3px 2px 6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:#d4d0c8;color:#000;border:2px outset #fff;width:18px;height:16px;text-align:center;cursor:pointer;line-height:12px;flex:none}
.body{padding:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:0}
.btn{font:12px Tahoma,sans-serif;padding:5px 12px;border:2px outset #fff;background:#d4d0c8;cursor:pointer;color:#000}
.btn:active,.on{border-style:inset}
.btns{display:flex;gap:6px;flex-wrap:wrap}
input{font:14px Tahoma,sans-serif;padding:5px;border:2px inset #999;background:#fff;color:#000;width:100%}
fieldset{border:1px solid #bbb;margin:0;padding:6px}
.card{width:88px;height:72px;border:2px outset #fff;background:var(--c,#d4d0c8);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:12px Tahoma;color:#000;gap:2px}
.card i{font-style:normal;font-size:28px}.card:active{border-style:inset}
.pal{display:flex;gap:4px;flex-wrap:wrap;padding:4px 6px;align-items:center}
.sw{width:22px;height:22px;border:2px solid #fff;outline:1px solid #555;padding:0;cursor:pointer}.sw.on{outline:2px solid #e00}
.cw{flex:1;min-height:0;background:#fff;border:2px inset #888;margin:0 6px 6px}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hb{height:12px;border:1px solid #555;background:#fff}.hb i{display:block;height:100%;background:#3a3;width:50%}
.fr{display:flex;gap:6px;justify-content:space-around;flex-wrap:wrap}
.fc{border:2px outset #fff;background:#e9e7dc;padding:2px;display:flex;flex-direction:column;align-items:center;font:11px Tahoma;cursor:pointer;width:80px;color:#000}
.fc .nd{background:#fff5cf;border:1px solid #222;border-radius:6px;padding:1px 4px;font:10px "Courier New",monospace;min-height:14px;text-align:center}
.sh{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#page{background:#fff;border:2px inset #999;padding:8px;font-size:13px;line-height:1.4}
#page h3{margin:0 0 6px;color:#00c}
#task{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(#3168d5,#245edb 20%,#1941a5);display:flex;align-items:center;z-index:7}
#start{height:100%;padding:0 18px 0 10px;border:0;border-radius:0 12px 12px 0;background:linear-gradient(#5cb85c,#2f8a2f);color:#fff;font:italic 700 17px Tahoma,sans-serif;text-shadow:1px 1px 2px #000;cursor:pointer}
#tbtn{margin-left:8px;min-width:120px;max-width:200px;height:22px;background:#1e52b7;border:1px solid #0a2d7a;border-radius:3px;color:#fff;font-size:12px;padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;visibility:hidden}
#tray{margin-left:auto;height:100%;background:linear-gradient(#0f8ce6,#0b6fc0);border-left:1px solid #0a4c8f;color:#fff;font-size:12px;padding:0 10px;display:flex;align-items:center;gap:10px}
#boot{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;transition:opacity .6s}
#boot b{font-size:26px}
#boot .pb{width:180px;height:12px;border:2px solid #aaa;border-radius:4px;padding:1px;overflow:hidden}
#boot .pb i{display:block;height:100%;width:40%;background:#3a7cf0;animation:ld 1.1s linear infinite}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}
#rot{display:none;position:fixed;inset:0;background:#0b1030;color:#fff;z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:18px}
#rot .ph{font-size:64px;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
#egg{position:absolute;z-index:9;display:none;width:80px;height:100px;pointer-events:none}
#egg.wob{animation:wob .45s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
#egg .top{transform-origin:40px 60px;transition:transform .8s,opacity .8s}
#egg.open .top{transform:translate(-26px,-46px) rotate(-55deg);opacity:0}
#egg.open .bot{opacity:0;transition:opacity 2s .8s}
#goals{border:2px dashed #999;padding:4px;background:#fff;border-radius:4px}
#belt{margin-top:auto;position:relative;height:44px;overflow:hidden;background:repeating-linear-gradient(90deg,#555 0 12px,#666 12px 24px);border:2px inset #999;flex:none}
.part{position:absolute;top:6px;left:-90px;height:30px;padding:0 8px;border:2px outset #fff;color:#fff;font:bold 11px Tahoma;text-shadow:1px 1px 1px #000;animation:mv 9s linear forwards;cursor:grab;touch-action:none}
@keyframes mv{from{left:-90px}to{left:100%}}
.chip{display:inline-block;margin:1px 2px;padding:1px 5px;border:1px solid #999;background:#fff;font-size:11px}.chip.ok{background:#9be38b}
#room{touch-action:none;position:relative;flex:1;min-height:110px;background:repeating-linear-gradient(90deg,#c8965a 0 28px,#b8864a 28px 30px);border:2px inset #999}
.it{position:absolute;font-size:26px;line-height:1;pointer-events:none}
.it.win{width:24%;height:34%;border:4px solid #8a6a3a;background:linear-gradient(135deg,#bfe4ff,#eaf7ff)}
.it.win::after{content:'';position:absolute;inset:0;background:rgba(95,85,60,.85);opacity:var(--d,1)}
.it.dirt{width:36px;height:22px;border-radius:50%;background:radial-gradient(#5a3b1c,#7a5a30 65%,transparent 70%)}
.npc{position:absolute;bottom:32px;z-index:5;width:44px;height:66px;cursor:pointer}
.wo .npc{display:none}
.nb{display:none;position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);width:max-content;max-width:190px;background:#fff5cf;color:#111;border:2px solid #222;border-radius:10px;padding:5px 8px;font:italic 11px/1.3 "Courier New",monospace;text-align:left;transform-origin:50% 100%;pointer-events:none}
.nb::after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top:10px solid #222;border-bottom:0}
.nb.pop{animation:pop .22s ease-out}
</style>
</head>
<body>
<div id="pc">
  <div id="icons">
    <button class="ic" data-app="net"><span>🌐</span>Сеть</button>
    <button class="ic" data-app="paint"><span>🎨</span>Paint</button>
    <button class="ic" data-app="game"><span>🌍</span>Веб-Мир</button>
    <button class="ic" data-app="food"><span>🪱</span>Еда</button>
    <button class="ic" data-app="music"><span>🎵</span>Музыка</button>
    <button class="ic" data-app="trash"><span>🗑️</span>Корзина</button>
  </div>

  <div id="w-ans" class="win"><div class="tb"><span class="tt" id="atitle">Вопрос</span><b class="x">×</b></div><div class="body" id="ansbody"></div></div>

  <div id="w-paint" class="win big"><div class="tb"><span class="tt" id="ptitle">Paint</span><b class="x">×</b></div>
    <div class="pal" id="pal"></div><div class="cw"><canvas id="cv"></canvas></div></div>

  <div id="w-net" class="win big"><div class="tb"><span class="tt">Обозреватель</span><b class="x">×</b></div>
    <div class="body"><div class="btns" id="nav"></div><input id="addr" readonly aria-label="адрес"><div id="page"></div></div></div>

  <div id="w-map" class="win big"><div class="tb"><span class="tt">Веб-Мир</span><b class="x">×</b></div><div class="body" style="padding:4px"><svg id="map" viewBox="0 0 400 240" style="width:100%;flex:1;min-height:0;touch-action:none;background:#f0d283"></svg></div></div>
  <div id="w-build" class="win big"><div class="tb"><span class="tt">Дом Джейд</span><b class="x">×</b></div><div class="body"><div style="display:flex;gap:8px;align-items:flex-start"><svg viewBox="0 0 60 88" width="44" height="64" style="flex:none"><path d="M26 52V76M34 52V76" stroke="#111" stroke-width="4"/><ellipse cx="23" cy="80" rx="6" ry="4" fill="#3fdc3a"/><ellipse cx="37" cy="80" rx="6" ry="4" fill="#3fdc3a"/><circle cx="30" cy="24" r="20" fill="#3fdc3a"/><path d="M10 38h40l-2 16h-4l-1-12-2 12h-4l-1-12-2 12h-4l-1-12-2 12h-4l-1-12-2 12h-4z" fill="#2fb32a"/><ellipse cx="22" cy="22" rx="4.5" ry="6" fill="#fff" stroke="#222"/><ellipse cx="38" cy="22" rx="4.5" ry="6" fill="#fff" stroke="#222"/><circle cx="22" cy="23" r="2"/><circle cx="38" cy="23" r="2"/><path d="M24 32q6 4 12 0" stroke="#111" fill="none" stroke-width="2"/></svg><div id="jmsg"></div></div><div id="goals"></div><div id="belt"></div></div></div>
  <div id="w-clean" class="win big"><div class="tb"><span class="tt">Дом Сэма</span><b class="x">×</b></div><div class="body"><div id="smsg"></div><div class="btns" id="ctools"></div><div id="room"></div></div></div>

  <div id="w-food" class="win big" style="bottom:auto"><div class="tb"><span class="tt">Еда для Кинито</span><b class="x">×</b></div>
    <div class="body"><div>Сытость:</div><div class="hb"><i id="hbar"></i></div><div class="btns" id="foods"></div></div></div>

  <div id="w-music" class="win big" style="bottom:auto"><div class="tb"><span class="tt">Музыкальная шкатулка</span><b class="x">×</b></div>
    <div class="body"><div>Тихая мелодия.</div><div class="btns"><button class="btn" id="mplay">▶ Играть</button></div></div></div>

  <div id="jade" class="npc" style="left:150px;visibility:hidden"><div class="nb"></div><svg viewBox="0 0 60 88" width="44" height="66"><path d="M26 52V76M34 52V76" stroke="#111" stroke-width="4"/><ellipse cx="23" cy="80" rx="6" ry="4" fill="#3fdc3a"/><ellipse cx="37" cy="80" rx="6" ry="4" fill="#3fdc3a"/><circle cx="30" cy="24" r="20" fill="#3fdc3a"/><path d="M10 38h40l-2 16h-4l-1-12-2 12h-4l-1-12-2 12h-4l-1-12-2 12h-4l-1-12-2 12h-4z" fill="#2fb32a"/><ellipse cx="22" cy="22" rx="4.5" ry="6" fill="#fff" stroke="#222"/><ellipse cx="38" cy="22" rx="4.5" ry="6" fill="#fff" stroke="#222"/><circle cx="22" cy="23" r="2"/><circle cx="38" cy="23" r="2"/><path d="M24 32q6 4 12 0" stroke="#111" fill="none" stroke-width="2"/></svg></div>
  <div id="sam" class="npc" style="right:26px;visibility:hidden"><div class="nb"></div><svg viewBox="0 -2 60 90" width="44" height="66"><path d="M26 56V76M34 56V76" stroke="#111" stroke-width="4"/><ellipse cx="23" cy="80" rx="6" ry="4" fill="#f0641e"/><ellipse cx="37" cy="80" rx="6" ry="4" fill="#f0641e"/><rect x="14" y="14" width="32" height="44" rx="8" fill="#f0641e"/><path d="M14 18L17 2L24 13L30 0L36 13L43 2L46 18Z" fill="#f0641e"/><ellipse cx="22" cy="28" rx="4.5" ry="6" fill="#fff" stroke="#222"/><ellipse cx="38" cy="28" rx="4.5" ry="6" fill="#fff" stroke="#222"/><circle cx="22" cy="29" r="2"/><circle cx="38" cy="29" r="2"/><path d="M22 40q8 6 16 0" stroke="#111" fill="none" stroke-width="2.5"/></svg></div>
  <div id="egg"><svg viewBox="0 0 80 100" width="80" height="100"><g class="bot"><path d="M6 62L18 55L28 65L40 55L52 65L62 55L74 62Q78 95 40 98Q2 95 6 62Z" fill="#f3a6e8"/></g><g class="top"><path d="M6 62L18 55L28 65L40 55L52 65L62 55L74 62Q78 10 40 2Q2 10 6 62Z" fill="#f3a6e8"/><circle cx="26" cy="30" r="5" fill="#e77bd8"/><circle cx="52" cy="22" r="3.5" fill="#e77bd8"/><circle cx="56" cy="44" r="4" fill="#e77bd8"/><path id="crack" d="M40 4L34 20L44 32L36 48L42 60" stroke="#7a2a70" stroke-width="2" fill="none" style="display:none"/></g></svg></div>
  <div id="kin" aria-label="Кинито">
    <div id="bub"></div>
    <svg viewBox="0 0 200 430">
      <defs>
        <clipPath id="c1"><circle cx="70" cy="105" r="17"/></clipPath>
        <clipPath id="c2"><circle cx="130" cy="105" r="17"/></clipPath>
        <g id="gills"><path d="M46 80 L14 22 L58 66Z" fill="#b53ad6"/><path d="M36 100 L0 62 L46 92Z" fill="#c94be0"/><path d="M34 122 L2 116 L40 110Z" fill="#b53ad6"/></g>
      </defs>
      <use href="#gills"/><use href="#gills" transform="translate(200 0) scale(-1 1)"/>
      <g id="board"><ellipse cx="100" cy="416" rx="98" ry="15" fill="#7be03a"/><path d="M12 414 Q100 404 188 414" stroke="#fff" stroke-width="4" fill="none"/></g>
      <path d="M82 165 L96 165 L99 260 L94 388 L82 388 L84 260Z" fill="#170f33"/>
      <path d="M104 165 L118 165 L116 260 L118 388 L106 388 L101 260Z" fill="#170f33"/>
      <path d="M50 410 L86 386 L98 390 L100 412Z" fill="#170f33"/><path d="M150 410 L114 386 L102 390 L100 412Z" fill="#170f33"/>
      <path d="M100 46C55 46 30 80 30 118c0 34 30 56 70 56s70-22 70-56c0-38-25-72-70-72Z" fill="#e8a3f3"/>
      <circle cx="70" cy="105" r="17" fill="#fff"/><circle cx="130" cy="105" r="17" fill="#fff"/>
      <circle id="pl" cx="70" cy="108" r="6" fill="#111"/><circle id="pr" cx="130" cy="108" r="6" fill="#111"/>
      <rect id="l1" x="50" y="86" width="40" height="8" fill="#e8a3f3" clip-path="url(#c1)"/>
      <rect id="l2" x="110" y="86" width="40" height="8" fill="#e8a3f3" clip-path="url(#c2)"/>
      <g id="gl" style="display:none" fill="none" stroke="#222" stroke-width="4"><circle cx="70" cy="105" r="22"/><circle cx="130" cy="105" r="22"/><path d="M92 103h16"/></g>
      <g id="book" style="display:none"><rect x="50" y="185" width="100" height="70" fill="#2f9a45" stroke="#0c3d1a" stroke-width="4"/><rect x="58" y="193" width="40" height="54" fill="#fff"/><rect x="102" y="193" width="40" height="54" fill="#fff"/><path d="M64 208h28M64 220h28M108 208h28M108 220h28" stroke="#888" stroke-width="3"/></g>
      <g id="pen" style="display:none"><rect x="60" y="195" width="80" height="55" fill="#fff" stroke="#222" stroke-width="4"/><path d="M68 215h60M68 230h44" stroke="#888" stroke-width="3"/><path d="M150 170 L112 232" stroke="#2f9a45" stroke-width="9" stroke-linecap="round"/></g>
      <g id="zz" style="display:none" font-family="Courier New" font-weight="700" fill="#fff" stroke="#000" stroke-width="2"><text x="150" y="50" font-size="46">Z</text><text x="180" y="12" font-size="34">z</text></g>
    </svg>
  </div>

  <div id="task"><button id="start">пуск</button><div id="tbtn"></div>
    <div id="tray"><span id="hun">🪱</span><span id="clock"></span></div></div>
</div>
<div id="boot"><b>Кинито ОС</b><div class="pb"><i></i></div><div>Загрузка...</div></div>
<div id="rot"><div class="ph">📱</div><div>Поверни телефон горизонтально,<br>чтобы включить компьютер</div><button class="btn" id="fs">На весь экран</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const later=(f,ms)=>setTimeout(f,ms);
let S={name:'',age:'',answers:{},asked:[],drawn:[],hunger:70,game:0,last:Date.now()};
try{const r=localStorage.getItem('kinito3');if(r)S={...S,...JSON.parse(r)}}catch(e){}
const save=()=>{try{S.last=Date.now();localStorage.setItem('kinito3',JSON.stringify(S))}catch(e){}};
const onb=()=>S.name&&S.age&&S.answers.color;
const kin=$('#kin'),KW=49,KH=105;
let cur=null,curWin=null,hideT,drag=false,act=null,wt,typT,dx=0,dy=0;

/* ---------- Кинито: движение ---------- */
const W=()=>innerWidth,H=()=>innerHeight;
const gx=x=>Math.max(80,Math.min(W()-KW-60,x)),gy=y=>Math.max(80,Math.min(H()-30-KH-4,y));
function place(x,y){kin.style.transition='none';kin.style.left=x+'px';kin.style.top=y+'px'}
function walk(x,y,ms){
  kin.style.transition='left '+ms+'ms ease-in-out,top '+ms+'ms ease-in-out';
  kin.classList.add('walk');kin.style.left=x+'px';kin.style.top=y+'px';
  clearTimeout(wt);wt=later(()=>kin.classList.remove('walk'),ms);
}
function perch(id){const r=$('#'+id).getBoundingClientRect();walk(gx(r.left+r.width/2-KW/2),Math.max(75,r.top-KH+6),900)}
function corner(){walk(W()-KW-24,H()-30-KH-4,900)}
kin.addEventListener('pointerdown',e=>{drag=true;kin.setPointerCapture(e.pointerId);const r=kin.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;kin.style.transition='none';kin.style.left=r.left+'px';kin.style.top=r.top+'px';kin.classList.remove('walk');clearTimeout(wt)});
kin.addEventListener('pointermove',e=>{if(!drag)return;kin.style.left=Math.max(0,Math.min(W()-KW,e.clientX-dx))+'px';kin.style.top=Math.max(72,Math.min(H()-30-KH,e.clientY-dy))+'px'});
['pointerup','pointercancel'].forEach(t=>kin.addEventListener(t,()=>drag=false));

/* ---------- Кинито: действия (читает, спит, пишет) ---------- */
function setAct(a){
  act=a;const sl=a==='sleep';
  ['l1','l2'].forEach(id=>$('#'+id).setAttribute('height',sl?36:8));
  $('#book').style.display=a==='read'?'block':'none';
  $('#gl').style.display=a==='read'?'block':'none';
  $('#pen').style.display=a==='write'?'block':'none';
  $('#zz').style.display=sl?'block':'none';
  if(a==='read'||a==='write'){['pl','pr'].forEach((id,i)=>{$('#'+id).setAttribute('cx',i?130:70);$('#'+id).setAttribute('cy',116)})}
}
function typing(){
  if(!act)setAct(rnd(['read','sleep','write']));
  clearTimeout(typT);typT=later(()=>setAct(null),2500);
}
function look(x,y){
  if(act)return;
  const r=kin.getBoundingClientRect(),px=r.left+r.width/2,py=r.top+r.height*.25;
  const ex=x-px,ey=y-py,d=Math.hypot(ex,ey)||1,m=Math.min(6,d/20);
  [['pl',70],['pr',130]].forEach(([id,bx])=>{$('#'+id).setAttribute('cx',bx+ex/d*m);$('#'+id).setAttribute('cy',108+ey/d*m*.6)});
}
addEventListener('pointermove',e=>look(e.clientX,e.clientY));

    g.style.cssText='position:fixed;z-index:50;animation:none;pointer-events:none;background:'+PARTS[p][1];
    document.body.appendChild(g);b.style.visibility='hidden';
    const mv=ev=>{g.style.left=(ev.clientX-30)+'px';g.style.top=(ev.clientY-15)+'px'};mv(e);
    const up=ev=>{
      removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      const r=$('#goals').getBoundingClientRect();g.remove();
      if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom&&wanted(p)){have[p]=(have[p]||0)+1;b.remove();bRender()}
      else b.style.visibility='visible';
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  $('#belt').appendChild(b);
}
function openBuild(){
  openWin('w-build');have={};stopBelt();$('#belt').innerHTML='';
  $('#jmsg').textContent='Джейд: Жду детали! Когда нужная поедет по ленте, перетащи её наверх, в список.';
  bRender();spawn();bT=setInterval(spawn,1500);
}

/* Комната Сэма: убираем сами, водя пальцем (швабра, метёлка, губка для стёкол) */
const TOOLS=[['mop','🧽 Швабра','dirt'],['broom','🧹 Метёлка','web'],['spg','🧴 Губка','win']];
let cTool='mop',cLeft=0,rub=false;
function tools(){
  const c=$('#ctools');c.innerHTML='';
  TOOLS.forEach(t=>{const b=document.createElement('button');b.className='btn'+(cTool===t[0]?' on':'');b.textContent=t[1];b.onclick=()=>{cTool=t[0];tools()};c.appendChild(b)});
}
function openClean(){
  openWin('w-clean');const r=$('#room');r.innerHTML='';cTool='mop';tools();
  $('#smsg').textContent='Сэм: Помоги убраться! Выбери инструмент и води пальцем по грязи, паутине и окнам.';
  const kinds=['dirt','dirt','dirt','web','web','web','win','win'];cLeft=kinds.length;
  kinds.forEach((k,i)=>{
    const b=document.createElement('div');b.className='it '+k;b.dataset.k=k;b.dataset.p=0;
    b.textContent=k==='web'?'🕸️':'';
    if(k==='win'){b.style.left=(i===6?14:59)+'%';b.style.top='6%'}
    else{b.style.left=(6+Math.random()*78)+'%';b.style.top=(42+Math.random()*40)+'%'}
    r.appendChild(b);
  });
}
function scrub(e){
  const need=TOOLS.find(t=>t[0]===cTool)[2];
  $$('#room .it').forEach(b=>{
    if(b.dataset.k!==need)return;
    const r=b.getBoundingClientRect();
    if(e.clientX<r.left-8||e.clientX>r.right+8||e.clientY<r.top-8||e.clientY>r.bottom+8)return;
    const p=+b.dataset.p+1;b.dataset.p=p;
    if(need==='win')b.style.setProperty('--d',1-p/10);else b.style.opacity=1-p/10;
    if(p>=10){
      if(need==='win')b.dataset.k='done';else b.remove();
      cLeft--;if(!cLeft){$('#smsg').textContent='Сэм: Вот это чистота! Спасибо, помощник!';S.sd=1;save()}
    }
  });
}
const room=$('#room');
room.addEventListener('pointerdown',e=>{rub=true;scrub(e)});
room.addEventListener('pointermove',e=>{if(rub)scrub(e)});
['pointerup','pointercancel','pointerleave'].forEach(t=>room.addEventListener(t,()=>rub=false));

/* ---------- Еда и музыка ---------- */
[['🪱 Червячок',30,'Ням! Мой любимый.'],['🍎 Яблоко',20,'Сладко. Спасибо.'],['🍰 Пирожное',15,'Ох... это слишком вкусно.']].forEach(([n,v,t])=>{
  const b=document.createElement('button');b.className='btn';b.textContent=n;
  b.onclick=()=>{if(S.hunger>95){say('Я больше не могу. Не сейчас.');return}S.hunger=Math.min(100,S.hunger+v);save();upd();say(t)};
  $('#foods').appendChild(b)});
function upd(){$('#hbar').style.width=S.hunger+'%';$('#hun').textContent='🪱 '+Math.round(S.hunger)+'%'}
let ac,mt=null,ni=0;const N=[392,466,523,466,392,349,392,0,349,415,466,415,349,311,349,0];
$('#mplay').onclick=()=>{
  if(mt){clearInterval(mt);mt=null;$('#mplay').textContent='▶ Играть';return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){say('Звук не включился...');return}
  $('#mplay').textContent='■ Стоп';say('Эта мелодия всегда играет у меня в голове.');
  mt=setInterval(()=>{const f=N[ni++%N.length];if(!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.6)},420);
};
winClose['w-music']=()=>{if(mt){clearInterval(mt);mt=null;$('#mplay').textContent='▶ Играть'}};

/* ---------- иконки ---------- */
$$('.ic').forEach(b=>b.onclick=()=>{
  const a=b.dataset.app;
  if(a==='paint'){if(!cur||cur.t!=='draw'){cur=null;openPaint(null)}}
  else if(a==='net'){openWin('w-net');site('kinito.pet');say(rnd(['Интернет... Здесь много всего.','Только не уходи там надолго.']))}
  else if(a==='game')openMap();
  else if(a==='food'){openWin('w-food');upd()}
  else if(a==='music')openWin('w-music');
  else if(a==='trash'){if(confirm('Удалить Кинито и все ответы?')){try{localStorage.removeItem('kinito3')}catch(e){}location.reload()}}
});
$('#start').onclick=()=>say('Выключить меня нельзя.');

/* ---------- жизнь ---------- */
const IDLE=['Ты здесь? Я чувствую.','Мне нравится, когда ты рядом.','Не уходи надолго.','Здесь так тихо, когда тебя нет.','Я смотрю на тебя. Не бойся.','Знаешь, аксолотли умеют отращивать лапки. Я вот ноги.','Мои ноги длинные, потому что я так хочу.','Ты моргаешь редко. Я тоже.','Хочешь, расскажу секрет? Нет. Пока нет.','Я люблю, когда шумит клавиатура.'];
setInterval(()=>{
  if(cur||curWin||!onb())return;
  S.hunger=Math.max(0,S.hunger-3);save();upd();
  const r=Math.random();
  if(S.hunger<25&&r<.5)say('Я голодный. Открой «Еду».');
  else if(r<.3)next();
  else if(r<.55)say(rnd(IDLE));
},35000);
setInterval(()=>{
  if(cur||drag||act||!onb()||Math.random()<.25)return;
  const x=gx(80+Math.random()*(W()-160)),y=gy(80+Math.random()*(H()-160));
  const r=kin.getBoundingClientRect(),d=Math.hypot(x-r.left,y-r.top);
  if(d<100)return;walk(x,y,d*16+1500);
},7000);
const clk=()=>{$('#clock').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})};
clk();setInterval(clk,10000);
$('#fs').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};

/* ---------- Джейд и Сэм: говорят, что нужно сделать ---------- */
function npcSay(id,t,ms){
  const n=$('#'+id+' .nb');n.textContent=t;n.style.display='block';n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop');
  clearTimeout(n._t);n._t=later(()=>{n.style.display='none'},ms||9000);
}
function npcs(first){
  if(!S.jd)npcSay('jade',first?'Привет! Я Джейд. Помоги мне собрать машину, велосипед и красный домик. Нажми на меня!':'Я жду! Нужно собрать машину, велосипед и домик.');
  later(()=>{if(!S.sd)npcSay('sam',first?'А я Сэм! У меня жуткий беспорядок. Помоги убраться: нажми на меня!':'Помоги мне убраться! Нажми на меня.')},first?3500:1500);
}
$('#jade').onclick=()=>{if(!curWin)openBuild()};
$('#sam').onclick=()=>{if(!curWin)openClean()};
setInterval(()=>{
  if(curWin||cur||!onb()||(S.jd&&S.sd))return;
  if(!S.jd&&(S.sd||Math.random()<.5))npcs(false);else if(!S.sd)npcSay('sam','Помоги мне убраться! Нажми на меня.');
},70000);

/* ---------- старт ---------- */
function intro(){
  const e=$('#egg'),r=kin.getBoundingClientRect();
  kin.style.opacity=0;e.style.left=(r.left+KW/2-40)+'px';e.style.top=(r.top+KH-92)+'px';
  e.style.display='block';e.classList.add('wob');
  later(()=>{$('#crack').style.display='block'},1800);
  later(()=>{
    e.classList.remove('wob');e.classList.add('open');
    kin.style.transition='opacity .6s';kin.style.opacity=1;
    later(()=>{e.style.display='none'},3200);
    sayAll(['Привет! Я Кинито.','Я твой маленький помощник. Давай знакомиться.'],next);
  },3000);
}
upd();if(S.game)showGame();
place(W()/2-KW/2,gy(H()*.35));
later(()=>{
  $('#boot').style.opacity=0;later(()=>$('#boot').remove(),700);
  if(!S.name)later(intro,600);
  else if(!onb())later(next,500);
  else{
    const mins=(Date.now()-S.last)/60000;
    S.hunger=Math.max(0,S.hunger-Math.min(mins*.1,50));upd();
    const t=mins>=60?Math.round(mins/60)+' ч':Math.round(mins)+' мин';
    say(mins>30?'С возвращением. Тебя не было '+t+'. Я ждал.':'Привет!');
  }
  later(()=>{$('#jade').style.visibility='visible';$('#sam').style.visibility='visible';npcs(!S.seen);S.seen=1;save()},500);
},2000);
</script>
</body>
