<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Infinite Green Field 3D</title>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; touch-action:none; }
#webgl-container{ width:100%; height:100%; display:block; }
.hud{ position:fixed; inset:0; pointer-events:none; }
.hint{ position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:18px; background:rgba(0,0,0,.6); color:#eee; font-size:16px; backdrop-filter:blur(8px); text-align:center; max-width:85%; transition:opacity .8s; }
.hint.hide{ opacity:0; }
.fs-btn{ pointer-events:auto; position:absolute; right:20px; top:20px; width:55px; height:55px; border:2px solid rgba(255,255,255,0.3); border-radius:16px; background:rgba(20,20,20,.7); color:white; font-size:26px; display:flex; align-items:center; justify-content:center; }
.jump-btn{ pointer-events:auto; position:absolute; right:30px; bottom:30px; width:75px; height:75px; border:3px solid rgba(255,255,255,0.4); border-radius:50%; background:rgba(20,20,20,.7); color:white; font-size:28px; display:flex; align-items:center; justify-content:center; }
.joy{ pointer-events:auto; position:absolute; left:30px; bottom:30px; width:150px; height:150px; border-radius:50%; background:rgba(0,0,0,.4); border:3px solid rgba(255,255,255,.3); }
.knob{ position:absolute; left:50%; top:50%; width:70px; height:70px; transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,.8); }
.crosshair{ position:absolute; top:50%; left:50%; width:10px; height:10px; transform:translate(-50%,-50%); pointer-events:none; }
.crosshair::before, .crosshair::after{ content:''; position:absolute; background:rgba(255,255,255,.6); }
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }
#rotate-screen{ position:fixed; inset:0; background:#111; color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:999; text-align:center; padding:20px; }
#rotate-screen .icon{ font-size:60px; margin-bottom:15px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="rotate-screen">
  <div class="icon">🔄</div>
  <h2>Поверните устройство</h2>
  <p>Для удобной игры переверните телефон горизонтально</p>
</div>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">Бесконечное зелёное поле. Исследуй холмы!</div>
  <div class="crosshair"></div>
  <button id="fs" class="fs-btn">⛶</button>
  <div id="jump" class="jump-btn">⬆</div>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

<script>
'use strict';

const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();

// Голубое небо и мягкий туман далеко у горизонта (огромная дальность)
scene.background = new THREE.Color(0x6ca6cd);
scene.fog = new THREE.FogExp2(0x6ca6cd, 0.0008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Освещение (солнце светит сверху-сбоку)
const sun = new THREE.DirectionalLight(0xfffaed, 0.85);
sun.position.set(300, 400, 200);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 1500;
const d = 400;
sun.shadow.camera.left = -d;
sun.shadow.camera.right = d;
sun.shadow.camera.top = d;
sun.shadow.camera.bottom = -d;
sun.shadow.bias = -0.0005;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xddeeff, 0.55));

// Генерация текстуры травы
const canvas = document.createElement('canvas');
canvas.width = 256; canvas.height = 256;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#4a8c3d'; ctx.fillRect(0, 0, 256, 256);
ctx.fillStyle = 'rgba(30,80,20,0.15)';
for(let i=0; i<500; i++) {
  ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
}
const floorTex = new THREE.CanvasTexture(canvas);
floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(160, 160);

const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, metalness: 0.0 });

// Функция холмов (делает ландшафтно-бесконечным)
function getTerrainHeight(x, z) {
  let h = Math.sin(x * 0.025) * Math.cos(z * 0.025) * 4.5;
  h += Math.sin(x * 0.07) * Math.sin(z * 0.07) * 1.5;
  h += Math.cos(x * 0.01) * Math.cos(z * 0.01) * 8.0;
  return h;
}

const floorGeo = new THREE.PlaneGeometry(3000, 3000, 180, 180);
floorGeo.rotateX(-Math.PI / 2);
const pos = floorGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const vx = pos.getX(i);
  const vz = pos.getZ(i);
  pos.setY(i, getTerrainHeight(vx, vz));
}
floorGeo.computeVertexNormals();

const grassFloor = new THREE.Mesh(floorGeo, floorMat);
grassFloor.receiveShadow = true;
scene.add(grassFloor);

// Мягкие полупрозрачные облака (никаких черных резких теней)
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
const cloudSphereGeo = new THREE.SphereGeometry(8, 7, 7);

for(let i=0; i<45; i++) {
  const cloudGroup = new THREE.Group();
  const puffsCount = 5 + Math.floor(Math.random() * 5);
  for(let p=0; p<puffsCount; p++) {
    const puff = new THREE.Mesh(cloudSphereGeo, cloudMat);
    puff.position.set(
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 5,
      (Math.random() - 0.5) * 40
    );
    const s = 1.0 + Math.random() * 1.8;
    puff.scale.set(s, s * 0.45, s);
    cloudGroup.add(puff);
  }
  cloudGroup.position.set(
    (Math.random() - 0.5) * 2200,
    130 + Math.random() * 50,
    (Math.random() - 0.5) * 2200
  );
  scene.add(cloudGroup);
}

// Управление игроком
let yaw = 0, pitch = 0;
let playerY = getTerrainHeight(0, 0) + 1.8;
let velocityY = 0;
const gravity = -18;
const jumpForce = 6.5;
let isGrounded = true;

camera.position.set(0, playerY, 0);

let moveX = 0, moveY = 0;

function updatePlayer(dt) {
  velocityY += gravity * dt;
  playerY += velocityY * dt;

  const terrainHeight = getTerrainHeight(camera.position.x, camera.position.z) + 1.8;
  if (playerY <= terrainHeight) {
    playerY = terrainHeight;
    velocityY = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }

  camera.position.y = playerY;
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const speed = 5.0 * dt;
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  const dir = new THREE.Vector3();
  dir.addScaledVector(forward, -moveY);
  dir.addScaledVector(side, moveX);
  if (dir.length() > 0) dir.normalize();

  camera.position.x += dir.x * speed;
  camera.position.z += dir.z * speed;
}

// Джойстик и тач-управление
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const jumpBtn = document.getElementById('jump');
const fsBtn = document.getElementById('fs');

let joyId = null, joyRect = null;
let lookId = null, lastTouchX = 0, lastTouchY = 0;

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
});

jumpBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (isGrounded) { velocityY = jumpForce; isGrounded = false; }
});

joy.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joy.setPointerCapture(joyId);
  joyRect = joy.getBoundingClientRect();
  updateJoy(e);
});

joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) updateJoy(e); });

function updateJoy(e) {
  let dx = e.clientX - (joyRect.left + joyRect.width/2);
  let dy = e.clientY - (joyRect.top + joyRect.height/2);
  const max = joyRect.width * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx / max;
  moveY = dy / max;
}

function resetJoy() {
  joyId = null; moveX = 0; moveY = 0;
  knob.style.transform = 'translate(-50%, -50%)';
}
joy.addEventListener('pointerup', resetJoy);
joy.addEventListener('pointercancel', resetJoy);

window.addEventListener('pointerdown', e => {
  if (e.target === joy || joy.contains(e.target) || e.target === jumpBtn || e.target === fsBtn) return;
  if (e.clientX > window.innerWidth * 0.3) {
    lookId = e.pointerId;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === lookId) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
    yaw -= dx * 0.005;
    pitch -= dy * 0.005;
    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  }
});

window.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

function checkOrientation() {
  const rotateScreen = document.getElementById('rotate-screen');
  rotateScreen.style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
}

window.addEventListener('resize', () => {
  checkOrientation();
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

checkOrientation();

let lastTime = performance.now();
function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  updatePlayer(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

setTimeout(() => document.getElementById('hint').classList.add('hide'), 4000);
requestAnimationFrame(animate);
</script>
</body>
</html>
