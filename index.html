<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms Bright Maze 3D</title>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; touch-action:none; }
#webgl-container{ width:100%; height:100%; display:block; }
.hud{ position:fixed; inset:0; pointer-events:none; }
.hint{ position:absolute; top:20px; left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:18px; background:rgba(30,30,25,.8); color:#eee; font-size:16px; backdrop-filter:blur(8px); text-align:center; max-width:85%; transition:opacity .8s; }
.hint.hide{ opacity:0; }
.fs-btn{ pointer-events:auto; position:absolute; right:20px; top:20px; width:55px; height:55px; border:2px solid rgba(255,255,255,0.3); border-radius:16px; background:rgba(20,19,15,.75); color:white; font-size:26px; display:flex; align-items:center; justify-content:center; }
.jump-btn{ pointer-events:auto; position:absolute; right:30px; bottom:30px; width:75px; height:75px; border:3px solid rgba(255,255,255,0.4); border-radius:50%; background:rgba(20,19,15,.75); color:white; font-size:28px; display:flex; align-items:center; justify-content:center; }
.joy{ pointer-events:auto; position:absolute; left:30px; bottom:30px; width:150px; height:150px; border-radius:50%; background:rgba(28,27,23,.62); border:3px solid rgba(190,190,190,.55); }
.knob{ position:absolute; left:50%; top:50%; width:70px; height:70px; transform:translate(-50%,-50%); border-radius:50%; background:rgba(190,190,190,.9); }
.crosshair{ position:absolute; top:50%; left:50%; width:10px; height:10px; transform:translate(-50%,-50%); pointer-events:none; }
.crosshair::before, .crosshair::after{ content:''; position:absolute; background:rgba(255,255,255,.8); }
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }
#minimap-container{ position:absolute; top:20px; left:20px; width:110px; height:110px; border-radius:50%; border:3px solid rgba(255,255,255,0.5); background:rgba(0,0,0,0.65); overflow:hidden; backdrop-filter:blur(4px); }
#minimap-canvas{ width:100%; height:100%; }
#danger-overlay{ position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle, transparent 40%, rgba(255,0,0,0.4) 100%); opacity:0; transition:opacity 0.2s; }
#rotate-screen{ position:fixed; inset:0; background:#0e0d0a; color:#f0e6c2; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:999; text-align:center; padding:20px; }
#rotate-screen .icon{ font-size:60px; margin-bottom:15px; }
#jumpscare-screen{ position:fixed; inset:0; background:black; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:red; font-family:monospace; }
#jumpscare-screen h1{ font-size:48px; margin-bottom:20px; text-shadow:0 0 10px red; }
#restart-btn{ pointer-events:auto; padding:12px 28px; font-size:20px; background:#111; color:#fff; border:2px solid red; border-radius:10px; cursor:pointer; }
#win-screen{ position:fixed; inset:0; background:rgba(0,40,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:#75ff75; font-family:sans-serif; text-align:center; padding:20px; backdrop-filter:blur(6px); }
#win-screen h1{ font-size:36px; margin-bottom:10px; text-shadow:0 0 10px #00ff00; }
#win-screen p{ font-size:20px; color:#e0ffe0; margin-bottom:25px; }
#continue-btn{ pointer-events:auto; padding:14px 32px; font-size:20px; background:#1b4d1b; color:#fff; border:2px solid #55ff55; border-radius:12px; cursor:pointer; box-shadow:0 0 15px rgba(0,255,0,0.4); }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="danger-overlay"></div>

<div id="rotate-screen">
  <div class="icon">🔄</div>
  <h2>Поверните устройство</h2>
  <p>Для удобной игры переверните телефон горизонтально</p>
</div>

<div id="jumpscare-screen">
  <h1>ВАС ПОЙМАЛИ</h1>
  <button id="restart-btn">ПОПРОБОВАТЬ СНОВА</button>
</div>

<div id="win-screen">
  <h1>ПОРТАЛ АКТИВИРОВАН!</h1>
  <p>Переход на бесконечное зелёное поле...</p>
  <button id="continue-btn">ВЫЙТИ НА ПОЛЕ</button>
</div>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">Уровень 1: Найди сияющий портал-дверь! (Стало светлее)</div>
  <div class="crosshair"></div>
  
  <div id="minimap-container">
    <canvas id="minimap-canvas" width="110" height="110"></canvas>
  </div>

  <button id="fs" class="fs-btn">⛶</button>
  <div id="jump" class="jump-btn">⬆</div>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

'use strict';

let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playStepSound() {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = currentLevel === 2 ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(currentLevel === 2 ? 80 : 120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
  } catch(e){}
}

function playJumpscareSound() {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
  } catch(e){}
}

function playTeleportSound() {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } catch(e){}
}

// Материалы стали светлее
function createWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#e0d080'; ctx.fillRect(0, 0, 256, 256); // Цвет стен стал ярче
  ctx.fillStyle = 'rgba(100,90,50,0.15)';
  for(let i=0; i<256; i+=16) ctx.fillRect(0, i, 256, 2);
  return new THREE.CanvasTexture(canvas);
}

function createCarpetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#786e4a'; ctx.fillRect(0, 0, 128, 128); // Пол стал светлее
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW * 2, MH * 2);
  return texture;
}
