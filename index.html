<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KinitoPet & Web World 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
}

/* === РАБОЧИЙ СТОЛ (DESKTOP) === */
#desktop {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #1e1e2f, #0f0c20);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

/* KINITO PET SPRITE / ANIMATION */
#kinito-container {
  position: relative;
  width: 220px;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.kinito-body {
  width: 160px;
  height: 160px;
  background: #ee4488;
  border-radius: 50%;
  position: relative;
  box-shadow: 0 0 30px rgba(238, 68, 136, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s ease;
}

/* Глаза и рот Кинито */
.kinito-face {
  width: 100px;
  height: 60px;
  position: relative;
}
.kinito-eye {
  width: 22px;
  height: 30px;
  background: #000;
  border-radius: 50%;
  position: absolute;
  top: 5px;
}
.kinito-eye.left { left: 15px; }
.kinito-eye.right { right: 15px; }
.kinito-eye::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  top: 4px; left: 4px;
}
.kinito-mouth {
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 12px;
  border-bottom: 4px solid #000;
  border-radius: 0 0 15px 15px;
}

/* Рука Кинито */
#kinito-hand {
  position: absolute;
  width: 80px;
  height: 120px;
  background: #ee4488;
  border-radius: 40px;
  top: 50px;
  right: -60px;
  transform-origin: top center;
  transform: rotate(-30deg) scale(0);
  transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: -2px 4px 10px rgba(0,0,0,0.3);
  z-index: 100;
}
#kinito-hand.grab {
  transform: rotate(-110deg) scale(1.4) translateY(-20px);
}

/* Диалоговое окно */
.dialog-box {
  background: rgba(255, 255, 255, 0.95);
  color: #111;
  padding: 20px 25px;
  border-radius: 18px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative;
  z-index: 20;
}
.dialog-box p {
  font-size: 18px;
  margin: 0 0 15px 0;
  line-height: 1.4;
}

.btn-group {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

button.ui-btn {
  background: #ee4488;
  color: white;
  border: none;
  padding: 10px 22px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
button.ui-btn:hover {
  background: #d63377;
  transform: scale(1.04);
}
button.ui-btn:active { transform: scale(0.96); }

/* Холст для рисования */
#canvas-container {
  display: none;
  flex-direction: column;
  align-items: center;
  margin-top: 10px;
}
#draw-canvas {
  background: #fff;
  border: 3px solid #ee4488;
  border-radius: 10px;
  cursor: crosshair;
  touch-action: none;
}

/* Окно притянутого Веб-мира */
#web-window {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 90%;
  max-width: 500px;
  background: #222;
  border: 4px solid #ee4488;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 0 50px rgba(238,68,136,0.8);
  transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 50;
}
#web-window.show {
  transform: translate(-50%, -50%) scale(1);
}

/* === 3D ИГРОВОЙ ЭКРАН === */
#game-3d {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

#webgl-container {
  width: 100%;
  height: 100%;
}

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}

.hint {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px;
  border-radius: 18px;
  background: rgba(20, 20, 20, 0.85);
  color: #fff;
  font-size: 16px;
  backdrop-filter: blur(8px);
  text-align: center;
  max-width: 85%;
  border: 1px solid rgba(255,255,255,0.2);
}

.joy {
  pointer-events: auto;
  position: absolute;
  left: 30px;
  bottom: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.4);
}
.knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 60px; height: 60px;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
}

/* Записка предупреждения */
#note-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 320px;
  background: #fbf0d9;
  color: #8b0000;
  padding: 25px;
  border-radius: 5px;
  font-family: 'Courier New', Courier, monospace;
  font-weight: bold;
  font-size: 20px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.9);
  border: 2px dashed #8b0000;
  z-index: 500;
  transition: transform 0.3s ease;
}
#note-popup.show {
  transform: translate(-50%, -50%) scale(1);
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<!-- ЭКРАН KINITOPET (РАБОЧИЙ СТОЛ) -->
<div id="desktop">
  <div id="kinito-container">
    <div class="kinito-body" id="kinito-body">
      <div class="kinito-face">
        <div class="kinito-eye left"></div>
        <div class="kinito-eye right"></div>
        <div class="kinito-mouth"></div>
      </div>
    </div>
    <div id="kinito-hand"></div>
  </div>

  <div class="dialog-box" id="dialog-box">
    <p id="dialog-text">Привет! Я Kinito! Добро пожаловать на твой ПК!</p>
    
    <div class="btn-group" id="btn-group">
      <!-- Кнопки генерируются динамически через JS -->
    </div>

    <div id="canvas-container">
      <canvas id="draw-canvas" width="280" height="150"></canvas>
      <button class="ui-btn" style="margin-top:10px;" onclick="finishDrawing()">Готово!</button>
    </div>
  </div>

  <!-- Окно притянутого сайта -->
  <div id="web-window">
    <h2 style="color:#ee4488; margin-top:0;">ВЕБ-МИР KINITOPET</h2>
    <p style="color:#ccc;">Исследуй мир, помогай друзьям и весело проводи время!</p>
    <button class="ui-btn" style="font-size:20px; padding:15px 35px;" onclick="enterWebWorld()">ИГРАТЬ</button>
  </div>
</div>

<!-- 3D ЭКРАН ИГРЫ -->
<div id="game-3d">
  <div id="webgl-container"></div>
  
  <div class="hud">
    <div id="hint" class="hint">Подойди к дому Джейда</div>
    <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
  </div>

  <div id="note-popup">
    ОТКЛЮЧИ ВСЕ ЭТИ ПОКА НЕ ПОЗДНО!
  </div>
</div>

<script>
'use strict';

/* === СОСТОЯНИЕ ДИАЛОГОВ И KINITOPET === */
const dialogText = document.getElementById('dialog-text');
const btnGroup = document.getElementById('btn-group');
const canvasContainer = document.getElementById('canvas-container');
const drawCanvas = document.getElementById('draw-canvas');
const ctx = drawCanvas.getContext('2d');
const kinitoHand = document.getElementById('kinito-hand');
const webWindow = document.getElementById('web-window');
const desktop = document.getElementById('desktop');
const game3D = document.getElementById('game-3d');

let isDrawing = false;
let userDrewSomething = false;
let isReadingBook = false;

// Рисование
ctx.strokeStyle = '#ee4488';
ctx.lineWidth = 4;
ctx.lineCap = 'round';

function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

drawCanvas.addEventListener('pointerdown', e => {
  isDrawing = true;
  userDrewSomething = true;
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);

  if (isReadingBook) {
    isReadingBook = false;
    dialogText.innerText = "Наверное, не слишком интересная книга... Давай я потом попробую написать более интересную книгу!";
    btnGroup.innerHTML = `<button class="ui-btn" onclick="startWebWorldPull()">Хорошо</button>`;
  }
});

drawCanvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
});

window.addEventListener('pointerup', () => isDrawing = false);

// Начало сценария
function step1_Season() {
  dialogText.innerText = "Какое твоё любимое время года?";
  btnGroup.innerHTML = `
    <button class="ui-btn" onclick="step2_Draw('Лето')">Лето ☀️</button>
    <button class="ui-btn" onclick="step2_Draw('Осень')">Осень 🍂</button>
    <button class="ui-btn" onclick="step2_Draw('Зима')">Зима ❄️</button>
  `;
}

function step2_Draw(season) {
  dialogText.innerText = `Ух ты, ${season}! Прекрасный выбор! А теперь, нарисуй мне что-нибудь на холсте ниже!`;
  btnGroup.innerHTML = '';
  canvasContainer.style.display = 'flex';
}

function finishDrawing() {
  canvasContainer.style.display = 'none';
  step3_BookQuestion();
}

function step3_BookQuestion() {
  dialogText.innerText = "Замечательный рисунок! Слушай... Я недавно написал свою книгу. Хочешь, я её тебе расскажу?";
  btnGroup.innerHTML = `
    <button class="ui-btn" onclick="readBook(true)">Да, с удовольствием!</button>
    <button class="ui-btn" onclick="readBook(false)">Нет, спасибо</button>
  `;
}

function readBook(agree) {
  if (!agree) {
    dialogText.innerText = "Ладно, думаю, эта книга не такая уж и интересная...";
    btnGroup.innerHTML = `<button class="ui-btn" onclick="startWebWorldPull()">Далее</button>`;
  } else {
    isReadingBook = true;
    dialogText.innerText = "Жил-был маленький розовая жижа по имени Кинито... Он любил учиться и заводить друзей...";
    btnGroup.innerHTML = `<button class="ui-btn" onclick="startWebWorldPull()">Продолжить</button>`;
  }
}

// Анимация: Кинито притягивает сайт рукой
function startWebWorldPull() {
  isReadingBook = false;
  dialogText.innerText = "О, кажется, нам пора отправляться в Веб-Мир!";
  btnGroup.innerHTML = '';
  
  setTimeout(() => {
    // Вытягивание руки
    kinitoHand.classList.add('grab');
    
    setTimeout(() => {
      // Показ притянутого веб-окна
      webWindow.classList.add('show');
    }, 600);
  }, 500);
}

function enterWebWorld() {
  desktop.style.display = 'none';
  game3D.style.display = 'block';
  init3DGame();
}

/* === 3D МИР (THREE.JS) === */
let scene, camera, renderer;
let moveX = 0, moveY = 0;
let yaw = 0;
let currentZone = 'jade'; // jade, sam
let jadeHouse, samHouse, jadeNpc, samNpc;
let isInteracting = false;

function init3DGame() {
  const container = document.getElementById('webgl-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // Голубое небо
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(50, 100, 50);
  scene.add(sun);

  // Трава
  const floorGeo = new THREE.PlaneGeometry(200, 200);
  const floorMat = new THREE.MeshLambertMaterial({ color: 0x55aa44 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Дом Джейда (Жёлтый с зеленой крышей)
  jadeHouse = createHouse(0xddcc55, 0x33aa55);
  jadeHouse.position.set(0, 0, -20);
  scene.add(jadeHouse);

  // Дом Сэма (Синий)
  samHouse = createHouse(0x4477cc, 0xcc4444);
  samHouse.position.set(40, 0, -20);
  scene.add(samHouse);

  // NPC Джейд
  jadeNpc = createNPC(0x33aa77);
  jadeNpc.position.set(0, 1.2, -13);
  scene.add(jadeNpc);

  // NPC Сэм
  samNpc = createNPC(0x3366cc);
  samNpc.position.set(40, 1.2, -13);
  scene.add(samNpc);

  camera.position.set(0, 1.6, 0);

  setupTouchControls();
  animate3D();
}

function createHouse(wallColor, roofColor) {
  const group = new THREE.Group();
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(8, 5, 8),
    new THREE.MeshLambertMaterial({ color: wallColor })
  );
  walls.position.y = 2.5;
  group.add(walls);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(6.5, 3.5, 4),
    new THREE.MeshLambertMaterial({ color: roofColor })
  );
  roof.position.y = 6.25;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);

  return group;
}

function createNPC(color) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 2.4),
    new THREE.MeshLambertMaterial({ color: color })
  );
  return mesh;
}

function update3DLogic() {
  if (isInteracting) return;

  const speed = 0.12;
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  camera.position.addScaledVector(forward, -moveY * speed);
  camera.position.addScaledVector(side, moveX * speed);
  camera.rotation.y = yaw;

  // Дистанция до Джейда
  if (camera.position.distanceTo(jadeNpc.position) < 3.0 && currentZone === 'jade') {
    startJadeEvent();
  }

  // Дистанция до Сэма
  if (camera.position.distanceTo(samNpc.position) < 3.0 && currentZone === 'sam') {
    startSamEvent();
  }
}

// Событие у дома Джейда: Письмо и Перехват Кинито
function startJadeEvent() {
  isInteracting = true;
  document.getElementById('hint').innerText = "Джейд: Спасибо, что пришел помой с убранством!";
  
  setTimeout(() => {
    // Вылетает письмо
    const note = document.getElementById('note-popup');
    note.classList.add('show');

    setTimeout(() => {
      // Резкий перехват Кинито
      note.classList.remove('show');
      alert("Кинито просыпается и утягивает письмо!");
      alert("Кинито: Что же? Зачем ты это открыл? Мы сейчас в разгаре очень интересной игры!");
      
      // Возврат на рабочий стол
      game3D.style.display = 'none';
      desktop.style.display = 'flex';
      webWindow.classList.remove('show');
      kinitoHand.classList.remove('grab');
      
      dialogText.innerText = "Упс... Кажется, в игре произошла небольшая ошибка! Давай продолжим наше общение.";
      btnGroup.innerHTML = `<button class="ui-btn" onclick="prepareSamZone()">Пойти к Сэму</button>`;
    }, 2500);
  }, 1500);
}

function prepareSamZone() {
  currentZone = 'sam';
  dialogText.innerText = "Сэм ждёт тебя у себя дома!";
  startWebWorldPull();
}

// Событие у дома Сэма: Диалог с просьбой помыть/помочь
function startSamEvent() {
  isInteracting = true;
  document.getElementById('hint').innerText = "Сэм и Кинито перед домом...";
  
  setTimeout(() => {
    alert("Сэм: Привет! Помоги нам привести в порядок двор!");
    alert("Кинито: Да! Помой здесь всё аккуратно, чтобы дом Сэма сиял!");
    document.getElementById('hint').innerText = "Задание: Помой и убери двор Сэма!";
    isInteracting = false;
  }, 1000);
}

// Сенсорный Джойстик
function setupTouchControls() {
  const joy = document.getElementById('joy');
  const knob = document.getElementById('knob');
  let joyId = null, joyRect = null;

  joy.addEventListener('pointerdown', e => {
    joyId = e.pointerId;
    joy.setPointerCapture(joyId);
    joyRect = joy.getBoundingClientRect();
    updateJoy(e);
  });

  joy.addEventListener('pointermove', e => {
    if (e.pointerId === joyId) updateJoy(e);
  });

  function updateJoy(e) {
    let dx = e.clientX - (joyRect.left + joyRect.width/2);
    let dy = e.clientY - (joyRect.top + joyRect.height/2);
    const max = joyRect.width * 0.35;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    moveX = dx / max;
    moveY = dy / max;
  }

  joy.addEventListener('pointerup', () => {
    joyId = null; moveX = 0; moveY = 0;
    knob.style.transform = 'translate(-50%, -50%)';
  });

  // Поворот камеры
  let lookId = null, lastX = 0;
  window.addEventListener('pointerdown', e => {
    if (e.clientX > window.innerWidth * 0.4 && !e.target.closest('#joy')) {
      lookId = e.pointerId;
      lastX = e.clientX;
    }
  });

  window.addEventListener('pointermove', e => {
    if (e.pointerId === lookId) {
      yaw -= (e.clientX - lastX) * 0.005;
      lastX = e.clientX;
    }
  });

  window.addEventListener('pointerup', e => {
    if (e.pointerId === lookId) lookId = null;
  });
}

function animate3D() {
  requestAnimationFrame(animate3D);
  update3DLogic();
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

// Старт игры
step1_Season();
</script>
</body>
</html>
