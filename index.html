<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кинито Пет</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Tahoma,"Trebuchet MS",sans-serif;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
:root{--kw:calc((100vh - 44px)*.465)}
#pc{position:fixed;inset:0;overflow:hidden;
background:
radial-gradient(ellipse 12% 7% at 22% 20%,#fff 0 40%,transparent 70%),
radial-gradient(ellipse 14% 7% at 62% 14%,#fff 0 40%,transparent 70%),
radial-gradient(ellipse 130% 55% at 25% 108%,#56a82a 0 58%,transparent 59%),
radial-gradient(ellipse 100% 42% at 95% 112%,#3f8a1a 0 60%,transparent 61%),
linear-gradient(#2a6bd8,#9fd0f7 68%)}
#icons{position:absolute;left:4px;top:6px;bottom:36px;display:flex;flex-direction:column;flex-wrap:wrap;gap:2px;align-content:flex-start}
.ic{width:64px;text-align:center;color:#fff;font:11px Tahoma,sans-serif;text-shadow:1px 1px 2px #000;background:none;border:0;padding:3px;border-radius:3px;cursor:pointer}
.ic span{display:block;font-size:26px;line-height:30px}
.ic:active,.ic:focus-visible{background:rgba(49,106,197,.65);outline:1px dotted #fff}
#kin{position:absolute;right:2vw;bottom:30px;height:calc(100% - 44px);width:var(--kw);cursor:pointer;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
#kin svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes sway{50%{transform:rotate(1.8deg)}}
@media (prefers-reduced-motion:reduce){#kin{animation:none}}
#bub{display:none;position:absolute;left:78px;right:calc(var(--kw) + 4vw);top:8px;background:#ffffe1;color:#111;border:1px solid #000;border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.3;z-index:5}
#bub::after{content:'';position:absolute;right:-9px;top:18px;border:8px solid transparent;border-left:9px solid #000;border-right:0}
.win{display:none;flex-direction:column;position:absolute;left:78px;width:min(480px,calc(100% - 78px - var(--kw) - 4vw - 8px));top:78px;max-height:calc(100% - 114px);background:#ece9d8;border:2px solid #0a3fbf;border-radius:8px 8px 0 0;box-shadow:3px 3px 10px rgba(0,0,0,.5);color:#000;z-index:4}
#w-paint{bottom:36px}
.tb{background:linear-gradient(#3b83ef,#0b4fd3);color:#fff;font-weight:700;font-size:13px;padding:3px 5px 3px 8px;display:flex;justify-content:space-between;align-items:center;border-radius:6px 6px 0 0;gap:6px}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:#d9442b;border:1px solid #fff;border-radius:3px;width:20px;height:20px;text-align:center;cursor:pointer;line-height:17px;flex:none}
.body{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.btn{font:13px Tahoma,sans-serif;padding:6px 10px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ddd8c4);cursor:pointer;color:#000}
.btn:active{background:#cfc9b0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
input{font:15px Tahoma,sans-serif;padding:7px;border:2px inset #999;background:#fff;color:#000;width:100%}
.row{display:flex;gap:6px}
.pal{display:flex;gap:4px;flex-wrap:wrap;padding:4px 6px;align-items:center}
.sw{width:22px;height:22px;border:2px solid #fff;outline:1px solid #555;padding:0;cursor:pointer}
.sw.on{outline:2px solid #e00}
.cw{flex:1;min-height:0;background:#fff;border:2px inset #888;margin:0 6px 6px}
#cv{width:100%;height:100%;display:block;touch-action:none}
.hb{height:12px;border:1px solid #555;background:#fff}.hb i{display:block;height:100%;background:#3a3;width:50%}
#task{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(#3168d5,#245edb 20%,#1941a5);display:flex;align-items:center;z-index:6}
#start{height:100%;padding:0 18px 0 10px;border:0;border-radius:0 12px 12px 0;background:linear-gradient(#5cb85c,#2f8a2f);color:#fff;font:italic 700 17px Tahoma,sans-serif;text-shadow:1px 1px 2px #000;cursor:pointer}
#tbtn{margin-left:8px;min-width:120px;max-width:200px;height:22px;background:#1e52b7;border:1px solid #0a2d7a;border-radius:3px;color:#fff;font-size:12px;padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;visibility:hidden}
#tray{margin-left:auto;height:100%;background:linear-gradient(#0f8ce6,#0b6fc0);border-left:1px solid #0a4c8f;color:#fff;font-size:12px;padding:0 10px;display:flex;align-items:center;gap:10px}
#boot{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;transition:opacity .6s}
#boot b{font-size:26px;letter-spacing:1px}
#boot .pb{width:180px;height:12px;border:2px solid #aaa;border-radius:4px;padding:1px;overflow:hidden}
#boot .pb i{display:block;height:100%;width:40%;background:#3a7cf0;animation:ld 1.1s linear infinite}
@keyframes ld{from{margin-left:-40%}to{margin-left:100%}}
#rot{display:none;position:fixed;inset:0;background:#0b1030;color:#fff;z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:18px}
#rot .ph{font-size:64px;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="pc">
  <div id="icons">
    <button class="ic" data-app="kin"><span>👾</span>Кинито</button>
    <button class="ic" data-app="paint"><span>🎨</span>Paint</button>
    <button class="ic" data-app="food"><span>🪱</span>Еда</button>
    <button class="ic" data-app="music"><span>🎵</span>Музыка</button>
    <button class="ic" data-app="trash"><span>🗑️</span>Корзина</button>
  </div>

  <div id="bub"></div>

  <div id="w-ans" class="win"><div class="tb"><span class="tt">Кинито спрашивает</span><b class="x">×</b></div><div class="body" id="ansbody"></div></div>

  <div id="w-paint" class="win"><div class="tb"><span class="tt" id="ptitle">Paint</span><b class="x">×</b></div>
    <div class="pal" id="pal"></div>
    <div class="cw"><canvas id="cv"></canvas></div>
  </div>

  <div id="w-food" class="win"><div class="tb"><span class="tt">Еда для Кинито</span><b class="x">×</b></div>
    <div class="body"><div>Сытость:</div><div class="hb"><i id="hbar"></i></div>
      <div class="btns" id="foods"></div></div></div>

  <div id="w-music" class="win"><div class="tb"><span class="tt">Музыкальная шкатулка</span><b class="x">×</b></div>
    <div class="body"><div>Тихая мелодия для Кинито.</div><div class="btns"><button class="btn" id="mplay">▶ Играть</button></div></div></div>

  <div id="kin" aria-label="Кинито">
  <svg viewBox="0 0 200 430">
    <defs>
      <clipPath id="c1"><circle cx="70" cy="105" r="17"/></clipPath>
      <clipPath id="c2"><circle cx="130" cy="105" r="17"/></clipPath>
      <g id="gills">
        <path d="M46 80 L14 22 L58 66Z" fill="#b53ad6"/>
        <path d="M36 100 L0 62 L46 92Z" fill="#c94be0"/>
        <path d="M34 122 L2 116 L40 110Z" fill="#b53ad6"/>
      </g>
    </defs>
    <use href="#gills"/><use href="#gills" transform="translate(200 0) scale(-1 1)"/>
    <path d="M82 165 L96 165 L99 260 L94 388 L82 388 L84 260Z" fill="#170f33"/>
    <path d="M104 165 L118 165 L116 260 L118 388 L106 388 L101 260Z" fill="#170f33"/>
    <path d="M50 410 L86 386 L98 390 L100 412Z" fill="#170f33"/>
    <path d="M150 410 L114 386 L102 390 L100 412Z" fill="#170f33"/>
    <path d="M100 46C55 46 30 80 30 118c0 34 30 56 70 56s70-22 70-56c0-38-25-72-70-72Z" fill="#e8a3f3"/>
    <circle cx="70" cy="105" r="17" fill="#fff"/><circle cx="130" cy="105" r="17" fill="#fff"/>
    <circle id="pl" cx="70" cy="108" r="6" fill="#111"/><circle id="pr" cx="130" cy="108" r="6" fill="#111"/>
    <rect id="l1" x="50" y="86" width="40" height="8" fill="#e8a3f3" clip-path="url(#c1)"/>
    <rect id="l2" x="110" y="86" width="40" height="8" fill="#e8a3f3" clip-path="url(#c2)"/>
  </svg>
  </div>

  <div id="task">
    <button id="start">пуск</button>
    <div id="tbtn"></div>
    <div id="tray"><span id="hun">🪱 --</span><span id="clock"></span></div>
  </div>
</div>

<div id="boot"><b>Кинито ОС</b><div class="pb"><i></i></div><div>Загрузка...</div></div>
<div id="rot"><div class="ph">📱</div><div>Поверни телефон горизонтально,<br>чтобы включить компьютер</div><button class="btn" id="fs">На весь экран</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const later=(f,ms)=>setTimeout(f,ms);
let S={name:'',age:'',answers:{},asked:[],drawn:[],hunger:70,last:Date.now()};
try{const r=localStorage.getItem('kinito2');if(r)S={...S,...JSON.parse(r)}}catch(e){}
const save=()=>{try{S.last=Date.now();localStorage.setItem('kinito2',JSON.stringify(S))}catch(e){}};

/* ---------- речь ---------- */
let tw,hideT,cur=null,curWin=null;
function say(t,after){
  clearTimeout(tw);clearTimeout(hideT);
  const b=$('#bub');b.style.display='block';b.textContent='';let i=0;
  (function n(){
    b.textContent=t.slice(0,++i);
    if(i<t.length){tw=setTimeout(n,28)}
    else{if(after)after();hideT=later(()=>{if(!curWin&&!cur)b.style.display='none'},9000)}
  })();
}

/* ---------- окна ---------- */
const winClose={};
function openWin(id,title){
  $$('.win').forEach(w=>w.style.display='none');
  $('#'+id).style.display='flex';curWin=id;
  const t=$('#tbtn');t.style.visibility='visible';t.textContent=title||$('#'+id+' .tt').textContent;
}
function closeWin(silent){
  const id=curWin;$$('.win').forEach(w=>w.style.display='none');curWin=null;
  $('#tbtn').style.visibility='hidden';
  if(!silent&&id&&winClose[id])winClose[id]();
}
$$('.win .x').forEach(x=>x.onclick=()=>closeWin(false));

/* ---------- вопросы ---------- */
const SKIP=['Не хочешь отвечать? Ладно... Я подожду.','Ты закрыл окно. Но я всё равно здесь.','Хорошо. Спрошу позже.'];
const DR=['Красиво... Я запомню это.','Это ты? Или это я?','Спасибо. Я буду смотреть на это, когда тебя нет.','Интересно. Очень интересно.','Я повешу это у себя в голове.'];
const QN={id:'name',t:'text',q:'Привет. Я Кинито. Как тебя зовут?',set:a=>S.name=a,re:a=>'Приятно познакомиться, '+a+'. Я запомню твоё имя.'};
const QA={id:'age',t:'text',q:'Сколько тебе лет?',set:a=>S.age=a,re:a=>a+'... Отличный возраст. Мы подружимся, '+S.name+'.'};
const Q=[
 {id:'feel',t:'choice',q:'Как ты себя чувствуешь сегодня?',o:['Отлично','Нормально','Плохо'],re:a=>({'Отлично':'Как я рад! Оставайся таким.','Нормально':'Нормально — это тоже хорошо.','Плохо':'Мне жаль. Побудь со мной, станет лучше.'})[a]},
 {id:'fear',t:'text',q:'Чего ты боишься больше всего?',re:a=>'«'+a+'»... Я никому не скажу. Наверное.'},
 {id:'dream',t:'text',q:'О чём ты мечтаешь?',re:a=>'Хорошая мечта. Я помогу тебе о ней не забыть.'},
 {id:'dhappy',t:'draw',q:'Нарисуй, как выглядит счастье.'},
 {id:'dhome',t:'draw',q:'Нарисуй свой дом.'},
 {id:'dme',t:'draw',q:'Нарисуй меня. Только не забудь про ноги.'},
 {id:'dfear',t:'draw',q:'Нарисуй свой самый страшный сон.'},
 {id:'dcalm',t:'draw',q:'Нарисуй место, где тебе спокойно.'},
 {id:'alone',t:'choice',q:'Ты сейчас один?',o:['Да','Нет'],re:a=>a==='Да'?'Хорошо. Так мне спокойнее.':'Кто рядом с тобой? Я хочу знать.'},
 {id:'friend',t:'text',q:'Как зовут твоего лучшего друга?',re:a=>a+'... Он хороший? Я не ревную. Почти.'},
 {id:'dn',t:'choice',q:'Что тебе больше нравится?',o:['День','Ночь'],re:a=>a==='Ночь'?'Ночью тише. Ночью мы вдвоём.':'День яркий. Но ночью ты приходишь чаще.'},
 {id:'mem',t:'text',q:'Расскажи о самом счастливом воспоминании.',re:a=>'Спасибо, что поделился. Теперь оно и моё.'},
 {id:'real',t:'choice',q:'Ты веришь, что я настоящий?',o:['Да','Нет','Иногда'],re:a=>a==='Нет'?'Тогда почему ты со мной разговариваешь?':'Это хорошо. Мне важно, чтобы ты верил.'},
 {id:'today',t:'text',q:'Что ты сегодня делал?',re:a=>'Понятно. Я в это время ждал тебя.'},
 {id:'tmr',t:'choice',q:'Ты придёшь завтра?',o:['Да','Постараюсь','Нет'],re:a=>a==='Нет'?'Ты так говоришь, но всё равно возвращаешься.':'Я буду ждать. Я всегда жду.'}
];
function callback(){
  if(Math.random()>.4)return null;
  const a=S.answers,o=[];
  if(a.fear)o.push('Я помню, ты боишься: «'+a.fear+'». Я никому не скажу.');
  if(a.friend)o.push('Как там '+a.friend+'? Я помню твоего друга.');
  if(a.dream)o.push('Я помню, ты мечтал: «'+a.dream+'».');
  S.drawn.forEach(d=>o.push('Я помню такой вопрос: «'+d+'». Ты нарисовал это очень необычно.'));
  return o.length?rnd(o):null;
}
function next(){
  if(!S.name)return ask(QN);
  if(!S.age)return ask(QA);
  let pool=Q.filter(q=>!S.asked.includes(q.id));
  if(!pool.length){S.asked=[];pool=Q.slice()}
  const q=rnd(pool),cb=callback();
  if(cb){cur=q;say(cb,()=>later(()=>ask(q),1500))}else ask(q);
}
function ask(q){
  cur=q;say(q.q);
  if(q.t==='draw')openPaint(q);else openAnswer(q);
}
function answer(q,a){
  cur=null;closeWin(true);
  S.answers[q.id]=a;if(!S.asked.includes(q.id))S.asked.push(q.id);
  if(q.set)q.set(a);save();
  say(q.re(a),()=>{if(q===QN)later(next,2500)});
}
function openAnswer(q){
  const b=$('#ansbody');b.innerHTML='';
  if(q.t==='text'){
    const i=document.createElement('input');i.maxLength=40;i.placeholder='Твой ответ...';
    const ok=document.createElement('button');ok.className='btn';ok.textContent='Ответить';
    const go=()=>{const v=i.value.trim();if(v)answer(q,v)};
    ok.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};
    b.append(i,ok);openWin('w-ans');setTimeout(()=>i.focus(),50);
  }else{
    const d=document.createElement('div');d.className='btns';
    q.o.forEach(o=>{const x=document.createElement('button');x.className='btn';x.textContent=o;x.onclick=()=>answer(q,o);d.appendChild(x)});
    b.appendChild(d);openWin('w-ans');
  }
}
winClose['w-ans']=()=>{if(cur){cur=null;say(rnd(SKIP))}};

/* ---------- Paint ---------- */
const COL=['#000000','#e02020','#f5a300','#f2e600','#2ea043','#1f6feb','#8a2be2','#ffffff'];
let color='#000',size=4,strokes=0,pT,pStart=0,longSaid=false,pq=null,drawing=false,cv,cx;
COL.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c==='#000000'?' on':'');b.style.background=c;b.setAttribute('aria-label','цвет');
  b.onclick=()=>{color=c;$$('.sw').forEach(s=>s.classList.remove('on'));b.classList.add('on')};$('#pal').appendChild(b)});
[['Тонко',3],['Толсто',9]].forEach(([n,s])=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>size=s;$('#pal').appendChild(b)});
const bc=document.createElement('button');bc.className='btn';bc.textContent='Очистить';bc.onclick=()=>wipe();$('#pal').appendChild(bc);
const bd=document.createElement('button');bd.className='btn';bd.textContent='Готово';bd.id='pdone';$('#pal').appendChild(bd);
function wipe(){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);strokes=0}
function openPaint(q){
  pq=q;openWin('w-paint','Paint');
  $('#ptitle').textContent='Paint — '+(q?q.q:'Рисунок');
  cv=$('#cv');const p=cv.parentNode;cv.width=p.clientWidth;cv.height=p.clientHeight;
  cx=cv.getContext('2d');cx.lineCap='round';cx.lineJoin='round';wipe();
  longSaid=false;pStart=Date.now();clearTimeout(pT);
  pT=later(()=>{if(curWin==='w-paint'){longSaid=true;say('Ох, не думал, что ты так долго рисуешь.')}},50000);
}
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
$('#cv').addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);cx.strokeStyle=color;cx.lineWidth=size;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);cx.stroke();strokes++});
$('#cv').addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke()});
['pointerup','pointercancel'].forEach(t=>$('#cv').addEventListener(t,()=>drawing=false));
bd.onclick=()=>{
  const q=pq,secs=(Date.now()-pStart)/1000;clearTimeout(pT);closeWin(true);cur=null;pq=null;
  if(q){S.drawn.push(q.q.replace(/[.]$/,''));S.drawn=S.drawn.slice(-5);if(!S.asked.includes(q.id))S.asked.push(q.id);save()}
  say(strokes===0?'Ты ничего не нарисовал. Пустота — тоже ответ.':secs<6?'Так быстро? Ты даже не старался.':longSaid?'Наконец-то. Оно того стоило... наверное.':rnd(DR));
};
winClose['w-paint']=()=>{clearTimeout(pT);if(pq){cur=null;pq=null;say('Не хочешь рисовать? Ладно... Но я запомню.')}};

/* ---------- Еда ---------- */
[['🪱 Червячок',30,'Ням! Мой любимый.'],['🍎 Яблоко',20,'Сладко. Спасибо.'],['🍰 Пирожное',15,'Ох... это слишком вкусно.']].forEach(([n,v,t])=>{
  const b=document.createElement('button');b.className='btn';b.textContent=n;
  b.onclick=()=>{if(S.hunger>95){say('Я больше не могу, '+(S.name||'')+'. Не сейчас.');return}S.hunger=Math.min(100,S.hunger+v);save();upd();say(t)};
  $('#foods').appendChild(b)});
function upd(){$('#hbar').style.width=S.hunger+'%';$('#hun').textContent='🪱 '+Math.round(S.hunger)+'%'}

/* ---------- Музыка ---------- */
let ac,mt=null;const N=[392,466,523,466,392,349,392,0,349,415,466,415,349,311,349,0];let ni=0;
$('#mplay').onclick=()=>{
  if(mt){clearInterval(mt);mt=null;$('#mplay').textContent='▶ Играть';return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){say('Звук не включился...');return}
  $('#mplay').textContent='■ Стоп';say('Эта мелодия всегда играет у меня в голове.');
  mt=setInterval(()=>{const f=N[ni++%N.length];if(!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.6)},420);
};
winClose['w-music']=()=>{if(mt){clearInterval(mt);mt=null;$('#mplay').textContent='▶ Играть'}};

/* ---------- иконки ---------- */
$$('.ic').forEach(b=>b.onclick=()=>{
  const a=b.dataset.app;
  if(a==='kin'){if(cur){ask(cur)}else if(!S.age||!S.name)next();else next()}
  else if(a==='paint'){if(!cur||cur.t!=='draw'){cur=null;openPaint(null);say('Нарисуй что хочешь. Я посмотрю.')}}
  else if(a==='food'){openWin('w-food');upd()}
  else if(a==='music')openWin('w-music');
  else if(a==='trash'){if(confirm('Удалить Кинито и все ответы?')){try{localStorage.removeItem('kinito2')}catch(e){}location.reload()}}
});
$('#start').onclick=()=>say('Выключить меня нельзя'+(S.name?', '+S.name:'')+'.');
$('#kin').onclick=()=>{if(cur||curWin)return;say(rnd(['Хи-хи. Щекотно.','Ты дотронулся до меня. Я почувствовал.','Не тыкай. Или тыкай. Мне нравится.']))};

/* ---------- глаза ---------- */
function look(x,y){
  const r=$('#kin').getBoundingClientRect();
  const px=r.left+r.width/2,py=r.top+r.height*.25;
  const dx=x-px,dy=y-py,d=Math.hypot(dx,dy)||1,m=Math.min(6,d/20);
  [['pl',70],['pr',130]].forEach(([id,bx])=>{$('#'+id).setAttribute('cx',bx+dx/d*m);$('#'+id).setAttribute('cy',108+dy/d*m*.6)});
}
addEventListener('pointermove',e=>look(e.clientX,e.clientY));
function blink(){['l1','l2'].forEach(id=>$('#'+id).setAttribute('height',36));later(()=>['l1','l2'].forEach(id=>$('#'+id).setAttribute('height',8)),140)}
setInterval(blink,4200);

/* ---------- таймеры ---------- */
const IDLE=[n=>'Ты здесь, '+n+'? Я чувствую.',n=>'Мне нравится, когда ты рядом.',n=>n+', не уходи надолго.',n=>'Здесь так тихо, когда тебя нет.',n=>'Я смотрю на тебя. Не бойся.'];
setInterval(()=>{
  if(cur||curWin||!S.age)return;
  S.hunger=Math.max(0,S.hunger-3);save();upd();
  const r=Math.random();
  if(S.hunger<25&&r<.5)say('Я голодный, '+S.name+'. Открой «Еду».');
  else if(r<.3)next();
  else if(r<.6)say(rnd(IDLE)(S.name));
},35000);
const clk=()=>{$('#clock').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})};
clk();setInterval(clk,10000);

/* ---------- экран поворота ---------- */
$('#fs').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}};

/* ---------- старт ---------- */
upd();
later(()=>{
  $('#boot').style.opacity=0;later(()=>$('#boot').remove(),700);
  if(!S.name||!S.age){later(next,500)}
  else{
    const mins=(Date.now()-S.last)/60000;
    S.hunger=Math.max(0,S.hunger-Math.min(mins*.1,50));upd();
    const t=mins>=60?Math.round(mins/60)+' ч':Math.round(mins)+' мин';
    say(mins>30?'С возвращением, '+S.name+'. Тебя не было '+t+'. Я ждал.':'Привет, '+S.name+'!');
  }
},2000);
</script>
</body>
</html>
