<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms 3D — Level 0 & Level 2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#webgl-container{
  width:100%;
  height:100%;
  display:block;
}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:18px;
  background:rgba(28,26,17,.72);
  color:#eee;
  font-size:16px;
  backdrop-filter:blur(8px);
  text-align:center;
  max-width:85%;
  transition:opacity .8s;
}

.hint.hide{ opacity:0; }

.fs-btn{
  pointer-events:auto;
  position:absolute;
  right:20px;
  top:20px;
  width:55px;
  height:55px;
  border:2px solid rgba(255,255,255,0.3);
  border-radius:16px;
  background:rgba(20,19,15,.75);
  color:white;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
}
.fs-btn:active{
  background:rgba(100,90,50,0.8);
  transform:scale(0.92);
}

.jump-btn{
  pointer-events:auto;
  position:absolute;
  right:30px;
  bottom:30px;
  width:75px;
  height:75px;
  border:3px solid rgba(255,255,255,0.4);
  border-radius:50%;
  background:rgba(20,19,15,.75);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
}
.jump-btn:active{
  background:rgba(100,90,50,0.8);
  transform:scale(0.92);
}

.joy{
  pointer-events:auto;
  position:absolute;
  left:30px;
  bottom:30px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(28,27,23,.62);
  border:3px solid rgba(190,190,190,.55);
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(190,190,190,.9);
}

.crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.crosshair::before, .crosshair::after{
  content:'';
  position:absolute;
  background:rgba(255,255,255,.6);
}
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }

/* МИНИ-КАРТА И КОМПАС */
#minimap-container{
  position:absolute;
  top:20px;
  left:20px;
  width:110px;
  height:110px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.65);
  overflow:hidden;
  box-shadow:0 0 10px rgba(0,0,0,0.8);
  backdrop-filter:blur(4px);
}
#minimap-canvas{
  width:100%;
  height:100%;
}

.compass-box{
  position:absolute;
  top:140px;
  left:35px;
  width:80px;
  height:35px;
  background:rgba(20,19,15,0.8);
  border:2px solid rgba(0,255,204,0.6);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffcc;
  font-weight:bold;
  font-size:18px;
  box-shadow:0 0 8px rgba(0,255,204,0.3);
  backdrop-filter:blur(4px);
}
#compass-arrow{
  display:inline-block;
  transition:transform 0.1s;
  margin-right:6px;
  font-size:20px;
}

#danger-overlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle, transparent 40%, rgba(255,0,0,0.4) 100%);
  opacity:0;
  transition:opacity 0.2s;
}

#rotate-screen{
  position:fixed;
  inset:0;
  background:#0e0d0a;
  color:#f0e6c2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:999;
  text-align:center;
  padding:20px;
}
#rotate-screen .icon{
  font-size:60px;
  margin-bottom:15px;
  animation:rotateAnim 2s infinite ease-in-out;
}
@keyframes rotateAnim {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}

#jumpscare-screen{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
  color:red;
  font-family:monospace;
}
#jumpscare-screen h1{
  font-size:48px;
  margin-bottom:20px;
  text-shadow:0 0 10px red;
}
#restart-btn{
  pointer-events:auto;
  padding:12px 28px;
  font-size:20px;
  background:#111;
  color:#fff;
  border:2px solid red;
  border-radius:10px;
  cursor:pointer;
}

#win-screen{
  position:fixed;
  inset:0;
  background:rgba(0,40,0,0.85);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
  color:#75ff75;
  font-family:sans-serif;
  text-align:center;
  padding:20px;
  backdrop-filter:blur(6px);
}
#win-screen h1{
  font-size:36px;
  margin-bottom:10px;
  text-shadow:0 0 10px #00ff00;
}
#win-screen p{
  font-size:20px;
  color:#e0ffe0;
  margin-bottom:25px;
}
#continue-btn{
  pointer-events:auto;
  padding:14px 32px;
  font-size:20px;
  background:#1b4d1b;
  color:#fff;
  border:2px solid #55ff55;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,0,0.4);
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="danger-overlay"></div>

<div id="rotate-screen">
  <div class="icon">🔄</div>
  <h2>Поверните устройство</h2>
  <p>Для удобной игры переверните телефон горизонтально</p>
</div>

<div id="jumpscare-screen">
  <h1>ВАС ПОЙМАЛИ</h1>
  <button id="restart-btn">ПОПРОБОВАТЬ СНОВА</button>
</div>

<div id="win-screen">
  <h1>ВЫ ПЕРЕШЛИ НА УРОВЕНЬ 2!</h1>
  <p>Бесконечное зелёное поле... Здесь безопасно?</p>
  <button id="continue-btn">ИССЛЕДОВАТЬ УРОВЕНЬ 2</button>
</div>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">🧭 Следуй за стрелкой компаса к выходу!</div>
  <div class="crosshair"></div>
  
  <div id="minimap-container">
    <canvas id="minimap-canvas" width="110" height="110"></canvas>
  </div>

  <div class="compass-box">
    <span id="compass-arrow">⬆</span> Выход
  </div>

  <button id="fs" class="fs-btn">⛶</button>
  <div id="jump" class="jump-btn">⬆</div>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

<script>
'use strict';

const map = [
  "##################################################",
  "#......................#.........................#",
  "#..##################..#..#####################..#",
  "#..#................#..#..#...................#..#",
  "#..#..############..#..#..#..###############..#..#",
  "#..#..#..........#..#..#..#..#.............#..#..#",
  "#..#..#..######..#..#.....#..#..#########..#..#..#",
  "#..#..#..#....#..#..#######..#..#.......#..#..#..#",
  "#.....#..#....#..#...........#..#.......#..#.....#",
  "#####.#..######..#############..#########..#####.#",
  "#.....#....................................#.....#",
  "#..#################..###################..#####.#",
  "#..#...............#..#.................#........#",
  "#..#..###########..#..#..#############..#######..#",
  "#..#..#.........#..#..#..#...........#........#..#",
  "#..#..#..#####..#..#..#..#..#######..#######..#..#",
  "#.....#..#...#..#.....#..#..#.....#........#..#..#",
  "#######..#...#..#######..#..#.....#######..#..#..#",
  "#........#...#...........#..#...........#..#.....#",
  "#..#######...#############..##########..#..#####.#",
  "#..#........................#........#..#......#.#",
  "#..#..####################..#..####..#..#####..#.#",
  "#..#..#..................#..#..#..#..#......#..#.#",
  "#..#..#..##############..#..#..#..#..#####..#..#.#",
  "#.....#..#............#..#..#     #......#..#....#",
  "########.#..########..#..#..###########..#..######",
  "#........#..#......#..#..#...............#.......#",
  "#..#######..#......#..#..######################..#",
  "#..#........#......#..#.......................#..#",
  "#..#..#######..#####..######################..#..#",
  "#..#..#.....#.........#....................#..#..#",
  "#..#..#     ########..#..################..#..#..#",
  "#.....#...............#..#..............#.....#..#",
  "#######..##############..#..##########..#######..#",
  "#........#...............#..#........#...........#",
  "#..#######..##############..#..####..##########..#",
  "#...........................#..#.................E",
  "##################################################"
];

const MW = map[0].length;
const MH = map.length;
const CELL_SIZE = 3;

const container = document.getElementById('webgl-container');
const dangerOverlay = document.getElementById('danger-overlay');
const minimapCanvas = document.getElementById('minimap-canvas');
const mmCtx = minimapCanvas.getContext('2d');
const compassArrow = document.getElementById('compass-arrow');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110e);
scene.fog = new THREE.FogExp2(0x11110e, 0.035);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0x999988, 1.0);
scene.add(ambientLight);

/* =========================
   ТЕКСТУРЫ
========================= */
function createWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c5b565';
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = 'rgba(80,70,30,0.12)';
  for(let i=0; i<256; i+=16) ctx.fillRect(0, i, 256, 2);
  for(let i=0; i<400; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
    ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
  }
  let gradTop = ctx.createLinearGradient(0, 0, 0, 30);
  gradTop.addColorStop(0, 'rgba(0,0,0,0.35)');
  gradTop.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradTop; ctx.fillRect(0, 0, 256, 30);
  let gradBot = ctx.createLinearGradient(0, 226, 0, 256);
  gradBot.addColorStop(0, 'rgba(0,0,0,0)');
  gradBot.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = gradBot; ctx.fillRect(0, 226, 256, 30);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

function createCarpetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#635936'; ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = 'rgba(30,25,10,0.2)';
  for(let i=0; i<300; i++) ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW * 2, MH * 2);
  return texture;
}

function createGrassTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#3a8c28'; ctx.fillRect(0, 0, 256, 256);
  for(let i=0; i<1500; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? '#2d6e1f' : '#49af33';
    ctx.fillRect(Math.random()*256, Math.random()*256, 2, 6);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(80, 80);
  return texture;
}

function createCeilingTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#8f886b'; ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#57523c'; ctx.lineWidth = 5;
  ctx.strokeRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW, MH);
  return texture;
}

function createGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255, 255, 210, 0.6)');
  grad.addColorStop(0.4, 'rgba(255, 240, 160, 0.2)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

function createMonsterTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,256,256);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(70, 90, 25, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(186, 90, 25, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(70, 90, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(186, 90, 8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.arc(128, 130, 80, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.stroke();
  return new THREE.CanvasTexture(canvas);
}

function createExitDoorTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#00ffcc'; ctx.fillRect(0,0,128,256);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center'; ctx.fillText('ВЫХОД', 64, 128);
  return new THREE.CanvasTexture(canvas);
}

/* =========================
   ПОСТРОЕНИЕ МИРА (LEVEL 0)
========================= */
const wallMat = new THREE.MeshLambertMaterial({ map: createWallTexture() });
const floorMat = new THREE.MeshLambertMaterial({ map: createCarpetTexture() });
const ceilingMat = new THREE.MeshLambertMaterial({ map: createCeilingTexture() });

const floorGeo = new THREE.PlaneGeometry(MW * CELL_SIZE, MH * CELL_SIZE);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set((MW * CELL_SIZE)/2, 0, (MH * CELL_SIZE)/2);
scene.add(floor);

const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set((MW * CELL_SIZE)/2, 3, (MH * CELL_SIZE)/2);
scene.add(ceiling);

const wallGeo = new THREE.BoxGeometry(CELL_SIZE, 3, CELL_SIZE);
const lampGeo = new THREE.BoxGeometry(1.2, 0.05, 0.6);
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

const glowMat = new THREE.MeshBasicMaterial({
  map: createGlowTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
});
const glowGeo = new THREE.PlaneGeometry(3.5, 3.5);

const walls = [];
let exitPos = new THREE.Vector3();

for (let y = 0; y < MH; y++) {
  for (let x = 0; x < MW; x++) {
    const posX = x * CELL_SIZE + CELL_SIZE/2;
    const posZ = y * CELL_SIZE + CELL_SIZE/2;

    if (map[y][x] === '#') {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(posX, 1.5, posZ);
      scene.add(wall);
      walls.push(wall);
    } else if (map[y][x] === 'E') {
      exitPos.set(posX, 1.5, posZ);
      const exitMat = new THREE.MeshBasicMaterial({ map: createExitDoorTexture() });
      const exitMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 3), exitMat);
      exitMesh.position.set(posX, 1.5, posZ - 1.4);
      scene.add(exitMesh);

      const exitLight = new THREE.PointLight(0x00ffcc, 2, 8);
      exitLight.position.set(posX, 2.5, posZ);
      scene.add(exitLight);
    } else {
      if ((x + y) % 4 === 0) {
        const lamp = new THREE.Mesh(lampGeo, lampMat);
        lamp.position.set(posX, 2.97, posZ);
        scene.add(lamp);

        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.rotation.x = Math.PI / 2;
        glow.position.set(posX, 2.94, posZ);
        scene.add(glow);
      }
    }
  }
}

/* =========================
   СОЗДАНИЕ МОНСТРА И ИГРОКА
========================= */
const monsterMat = new THREE.SpriteMaterial({ map: createMonsterTexture() });
const monster = new THREE.Sprite(monsterMat);
monster.scale.set(2.2, 2.2, 1);
scene.add(monster);

function respawnMonster() {
  monster.position.set(15 * CELL_SIZE + CELL_SIZE/2, 1.2, 15 * CELL_SIZE + CELL_SIZE/2);
}
respawnMonster();

camera.position.set(2.5 * CELL_SIZE, 1.5, 2.5 * CELL_SIZE);

/* =========================
   АЛГОРИТМ ПУТИ (BFS)
========================= */
function findPathBFS(startGrid, targetGrid) {
  const queue = [[startGrid]];
  const visited = new Set();
  visited.add(`${startGrid.x},${startGrid.y}`);
  const dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];

  while (queue.length > 0) {
    const path = queue.shift();
    const curr = path[path.length - 1];

    if (curr.x === targetGrid.x && curr.y === targetGrid.y) return path;

    for (let d of dirs) {
      const nx = curr.x + d.x;
      const ny = curr.y + d.y;
      if (nx >= 0 && nx < MW && ny >= 0 && ny < MH && map[ny][nx] !== '#') {
        const key = `${nx},${ny}`;
        if (!visited.has(key)) {
          visited.add(key);
          queue.push([...path, {x: nx, y: ny}]);
        }
      }
    }
  }
  return null;
}

/* =========================
   УПРАВЛЕНИЕ И ФИЗИКА
========================= */
let moveX = 0, moveY = 0;
let yaw = 0, pitch = 0;

let playerY = 1.5;
let velocityY = 0;
const gravity = -18;
const jumpForce = 6.5;
let isGrounded = true;
let isGameOver = false;
let currentLevel = 0;

let pathTimer = 0;
let currentMonsterPath = [];

function checkObjectCollision(pos, radius = 0.4) {
  if (currentLevel === 2) return false;
  for (let wall of walls) {
    const box = new THREE.Box3().setFromObject(wall);
    const objBox = new THREE.Box3(
      new THREE.Vector3(pos.x - radius, 0, pos.z - radius),
      new THREE.Vector3(pos.x + radius, 3, pos.z + radius)
    );
    if (box.intersectsBox(objBox)) return true;
  }
  return false;
}

function updateMinimapAndCompass() {
  if (currentLevel === 2) {
    document.getElementById('minimap-container').style.display = 'none';
    document.querySelector('.compass-box').style.display = 'none';
    return;
  }

  // Обновление мини-карты
  mmCtx.clearRect(0, 0, 110, 110);
  const px = camera.position.x;
  const pz = camera.position.z;

  mmCtx.save();
  mmCtx.translate(55, 55);

  const viewRadius = 18;
  const scale = 110 / (viewRadius * 2);

  mmCtx.fillStyle = '#887744';
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (map[y][x] === '#') {
        const wx = x * CELL_SIZE + CELL_SIZE/2 - px;
        const wz = y * CELL_SIZE + CELL_SIZE/2 - pz;
        if (Math.abs(wx) < viewRadius && Math.abs(wz) < viewRadius) {
          mmCtx.fillRect(
            wx * scale - (CELL_SIZE*scale)/2,
            wz * scale - (CELL_SIZE*scale)/2,
            CELL_SIZE * scale,
            CELL_SIZE * scale
          );
        }
      }
    }
  }

  mmCtx.fillStyle = '#00ff00';
  mmCtx.beginPath();
  mmCtx.arc(0, 0, 4, 0, Math.PI * 2);
  mmCtx.fill();

  mmCtx.strokeStyle = '#00ff00';
  mmCtx.lineWidth = 2;
  mmCtx.beginPath();
  mmCtx.moveTo(0, 0);
  mmCtx.lineTo(-Math.sin(yaw) * 10, -Math.cos(yaw) * 10);
  mmCtx.stroke();

  mmCtx.restore();

  // Обновление стрелки компаса на выход
  const dirToExit = new THREE.Vector3().subVectors(exitPos, camera.position);
  dirToExit.y = 0;
  dirToExit.normalize();

  const playerDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  playerDir.y = 0;
  playerDir.normalize();

  const angle = Math.atan2(dirToExit.x, dirToExit.z) - Math.atan2(playerDir.x, playerDir.z);
  compassArrow.style.transform = `rotate(${angle}rad)`;
}

function updatePlayer(dt) {
  if (isGameOver) return;

  velocityY += gravity * dt;
  playerY += velocityY * dt;

  if (playerY <= 1.5) {
    playerY = 1.5;
    velocityY = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }

  if (playerY > 2.4) {
    playerY = 2.4;
    velocityY = 0;
  }

  camera.position.y = playerY;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const speed = 4.5 * dt;
  const dir = new THREE.Vector3();
  
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  dir.addScaledVector(forward, -moveY);
  dir.addScaledVector(side, moveX);
  
  if (dir.length() > 0) dir.normalize();

  const nextPosX = camera.position.clone().addScaledVector(new THREE.Vector3(dir.x, 0, 0), speed);
  if (!checkObjectCollision(nextPosX, 0.4)) camera.position.x = nextPosX.x;

  const nextPosZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, dir.z), speed);
  if (!checkObjectCollision(nextPosZ, 0.4)) camera.position.z = nextPosZ.z;

  updateMinimapAndCompass();

  if (currentLevel === 0) {
    const mPos = monster.position;
    const pPos = camera.position;
    const dist = mPos.distanceTo(pPos);

    if (dist < 15) {
      dangerOverlay.style.opacity = (1 - dist / 15).toFixed(2);
    } else {
      dangerOverlay.style.opacity = '0';
    }

    pathTimer += dt;
    if (pathTimer > 0.4) {
      pathTimer = 0;
      const mGrid = { x: Math.floor(mPos.x / CELL_SIZE), y: Math.floor(mPos.z / CELL_SIZE) };
      const pGrid = { x: Math.floor(pPos.x / CELL_SIZE), y: Math.floor(pPos.z / CELL_SIZE) };
      const path = findPathBFS(mGrid, pGrid);
      if (path && path.length > 1) currentMonsterPath = path;
    }

    const monsterSpeed = 3.2 * dt;
    if (currentMonsterPath.length > 1) {
      const nextCell = currentMonsterPath[1];
      const targetPos = new THREE.Vector3(
        nextCell.x * CELL_SIZE + CELL_SIZE/2, 1.2, nextCell.y * CELL_SIZE + CELL_SIZE/2
      );
      const mDir = new THREE.Vector3().subVectors(targetPos, mPos);
      if (mDir.length() < 0.2) {
        currentMonsterPath.shift();
      } else {
        mDir.normalize();
        mPos.addScaledVector(mDir, monsterSpeed);
      }
    } else {
      const directDir = new THREE.Vector3().subVectors(pPos, mPos).normalize();
      mPos.addScaledVector(directDir, monsterSpeed);
    }

    if (dist < 1.3) {
      triggerJumpscare();
    }

    if (camera.position.distanceTo(exitPos) < 2.0) {
      triggerWin();
    }
  }
}

function triggerJumpscare() {
  isGameOver = true;
  dangerOverlay.style.opacity = '0';
  document.getElementById('jumpscare-screen').style.display = 'flex';
}

function triggerWin() {
  isGameOver = true;
  dangerOverlay.style.opacity = '0';
  document.getElementById('win-screen').style.display = 'flex';
}

document.getElementById('continue-btn').addEventListener('click', () => {
  document.getElementById('win-screen').style.display = 'none';
  loadLevel2();
  isGameOver = false;
});

function loadLevel2() {
  currentLevel = 2;

  while(scene.children.length > 0){ 
    scene.remove(scene.children[0]); 
  }

  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0xaaccff, 0.008);

  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(50, 100, 50);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x779977, 0.8));

  const grassMat = new THREE.MeshLambertMaterial({ map: createGrassTexture() });
  const grassFloor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), grassMat);
  grassFloor.rotation.x = -Math.PI / 2;
  scene.add(grassFloor);

  camera.position.set(0, 1.5, 0);

  document.getElementById('hint').innerText = "🟩 УРОВЕНЬ 2: Бесконечные зелёные поля";
  document.getElementById('hint').classList.remove('hide');
  setTimeout(() => document.getElementById('hint').classList.add('hide'), 6000);
}

document.getElementById('restart-btn').addEventListener('click', () => {
  location.reload();
});

/* =========================
   ТАЧ-СОБЫТИЯ
========================= */
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const jumpBtn = document.getElementById('jump');
const fsBtn = document.getElementById('fs');

let joyId = null, joyRect = null;
let lookId = null, lastTouchX = 0, lastTouchY = 0;

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});

jumpBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (isGrounded && !isGameOver) {
    velocityY = jumpForce;
    isGrounded = false;
  }
});

joy.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joy.setPointerCapture(joyId);
  joyRect = joy.getBoundingClientRect();
  updateJoy(e);
});

joy.addEventListener('pointermove', e => {
  if (e.pointerId === joyId) updateJoy(e);
});

function updateJoy(e) {
  let dx = e.clientX - (joyRect.left + joyRect.width/2);
  let dy = e.clientY - (joyRect.top + joyRect.height/2);
  const max = joyRect.width * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx / max;
  moveY = dy / max;
}

function resetJoy() {
  joyId = null; moveX = 0; moveY = 0;
  knob.style.transform = 'translate(-50%, -50%)';
}
joy.addEventListener('pointerup', resetJoy);
joy.addEventListener('pointercancel', resetJoy);

window.addEventListener('pointerdown', e => {
  if (e.target === joy || joy.contains(e.target) || e.target === jumpBtn || e.target === fsBtn) return;
  if (e.clientX > window.innerWidth * 0.3) {
    lookId = e.pointerId;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === lookId) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;

    yaw -= dx * 0.004;
    pitch -= dy * 0.004;
    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  }
});

window.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

function checkOrientation() {
  const rotateScreen = document.getElementById('rotate-screen');
  if (window.innerHeight > window.innerWidth) {
    rotateScreen.style.display = 'flex';
  } else {
    rotateScreen.style.display = 'none';
  }
}

window.addEventListener('resize', () => {
  checkOrientation();
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

checkOrientation();

let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  updatePlayer(dt);
  renderer.render(scene, camera);

  requestAnimationFrame(animate);
}

setTimeout(() => document.getElementById('hint').classList.add('hide'), 5000);

requestAnimationFrame(animate);
</script>
