<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms 3D — Level 0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#webgl-container{
  width:100%;
  height:100%;
  display:block;
}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:18px;
  background:rgba(28,26,17,.72);
  color:#eee;
  font-size:16px;
  backdrop-filter:blur(8px);
  text-align:center;
  max-width:85%;
  transition:opacity .8s;
}

.hint.hide{ opacity:0; }

.fs{
  pointer-events:auto;
  position:absolute;
  right:28px;
  bottom:30px;
  width:70px;
  height:70px;
  border:0;
  border-radius:20px;
  background:rgba(20,19,15,.82);
  color:white;
  font-size:30px;
}

.joy{
  pointer-events:auto;
  position:absolute;
  left:30px;
  bottom:30px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(28,27,23,.62);
  border:3px solid rgba(190,190,190,.55);
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(190,190,190,.9);
}

.crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:10px;
  height:10px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.crosshair::before, .crosshair::after{
  content:'';
  position:absolute;
  background:rgba(255,255,255,.6);
}
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }
</style>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">🕹️ Джойстик — ходить • Свайп справа — смотреть</div>
  <div class="crosshair"></div>
  <button id="fs" class="fs">⛶</button>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

<script>
'use strict';

/* =========================
   УВЕЛИЧЕННАЯ КАРТА УРОВНЯ (28x22)
========================= */
const map = [
  "############################",
  "#..........................#",
  "#..#####....#####....####..#",
  "#..#...#....#...#....#..#..#",
  "#..#...######...######..#..#",
  "#..#....................#..#",
  "#..######..######..######..#",
  "#.......#..#....#..#.......#",
  "#.......#..#....#..#.......#",
  "#..######..######..######..#",
  "#..#....................#..#",
  "#..#...######...######..#..#",
  "#..#...#....#...#....#..#..#",
  "#..#####....#####....####..#",
  "#..........................#",
  "#..######..######..######..#",
  "#..#....#..#....#..#....#..#",
  "#..#....#..#....#..#....#..#",
  "#..#....####....####....#..#",
  "#..........................#",
  "############################"
];

const MW = map[0].length;
const MH = map.length;
const CELL_SIZE = 3;

/* =========================
   ИНИЦИАЛИЗАЦИЯ THREE.JS
========================= */
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110e);
scene.fog = new THREE.FogExp2(0x11110e, 0.05);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

// Рассеянный свет
const ambientLight = new THREE.AmbientLight(0x888877, 0.9);
scene.add(ambientLight);

/* =========================
   ТЕКСТУРЫ С ЗАПЕЧЁННЫМИ ТЕНЯМИ
========================= */
function createWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#bfae5e';
  ctx.fillRect(0, 0, 256, 256);
  
  // Рисунок обоев
  ctx.fillStyle = 'rgba(80,70,30,0.12)';
  for(let i=0; i<256; i+=16) ctx.fillRect(0, i, 256, 2);
  for(let i=0; i<400; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
    ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
  }

  // Тень сверху и снизу стены (Ambient Occlusion)
  let gradTop = ctx.createLinearGradient(0, 0, 0, 45);
  gradTop.addColorStop(0, 'rgba(0,0,0,0.45)');
  gradTop.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradTop;
  ctx.fillRect(0, 0, 256, 45);

  let gradBot = ctx.createLinearGradient(0, 211, 0, 256);
  gradBot.addColorStop(0, 'rgba(0,0,0,0)');
  gradBot.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = gradBot;
  ctx.fillRect(0, 211, 256, 45);

  // Границы по бокам
  let gradLeft = ctx.createLinearGradient(0, 0, 20, 0);
  gradLeft.addColorStop(0, 'rgba(0,0,0,0.25)');
  gradLeft.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradLeft;
  ctx.fillRect(0, 0, 20, 256);

  let gradRight = ctx.createLinearGradient(236, 0, 256, 0);
  gradRight.addColorStop(0, 'rgba(0,0,0,0)');
  gradRight.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = gradRight;
  ctx.fillRect(236, 0, 20, 256);

  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

function createCarpetTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#635936';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = 'rgba(30,25,10,0.2)';
  for(let i=0; i<300; i++) ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW * 2, MH * 2);
  return texture;
}

function createCeilingTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#8f886b';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#57523c';
  ctx.lineWidth = 5;
  ctx.strokeRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(MW, MH);
  return texture;
}

/* =========================
   ПОСТРОЕНИЕ МИРА
========================= */
const wallMat = new THREE.MeshLambertMaterial({ map: createWallTexture() });
const floorMat = new THREE.MeshLambertMaterial({ map: createCarpetTexture() });
const ceilingMat = new THREE.MeshLambertMaterial({ map: createCeilingTexture() });

// Пол и Потолок
const floorGeo = new THREE.PlaneGeometry(MW * CELL_SIZE, MH * CELL_SIZE);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set((MW * CELL_SIZE)/2, 0, (MH * CELL_SIZE)/2);
scene.add(floor);

const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set((MW * CELL_SIZE)/2, 3, (MH * CELL_SIZE)/2);
scene.add(ceiling);

// Стены и Лампы
const wallGeo = new THREE.BoxGeometry(CELL_SIZE, 3, CELL_SIZE);
const lampGeo = new THREE.BoxGeometry(1.2, 0.1, 0.6);
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffd0 });

const walls = [];

for (let y = 0; y < MH; y++) {
  for (let x = 0; x < MW; x++) {
    const posX = x * CELL_SIZE + CELL_SIZE/2;
    const posZ = y * CELL_SIZE + CELL_SIZE/2;

    if (map[y][x] === '#') {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(posX, 1.5, posZ);
      scene.add(wall);
      walls.push(wall);
    } else {
      if ((x + y) % 3 === 0) {
        const lamp = new THREE.Mesh(lampGeo, lampMat);
        lamp.position.set(posX, 2.95, posZ);
        scene.add(lamp);
      }
    }
  }
}

// Позиция игрока
camera.position.set(2.5 * CELL_SIZE, 1.5, 2.5 * CELL_SIZE);

/* =========================
   УПРАВЛЕНИЕ И ФИЗИКА
========================= */
let moveX = 0, moveY = 0;
let yaw = 0, pitch = 0;

function checkCollision(newPos) {
  const radius = 0.4;
  for (let wall of walls) {
    const box = new THREE.Box3().setFromObject(wall);
    const playerBox = new THREE.Box3(
      new THREE.Vector3(newPos.x - radius, 0, newPos.z - radius),
      new THREE.Vector3(newPos.x + radius, 3, newPos.z + radius)
    );
    if (box.intersectsBox(playerBox)) return true;
  }
  return false;
}

function updatePlayer(dt) {
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const speed = 4.0 * dt;
  const dir = new THREE.Vector3();
  
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  dir.addScaledVector(forward, -moveY);
  dir.addScaledVector(side, moveX);
  
  if (dir.length() > 0) dir.normalize();

  const nextPosX = camera.position.clone().addScaledVector(new THREE.Vector3(dir.x, 0, 0), speed);
  if (!checkCollision(nextPosX)) camera.position.x = nextPosX.x;

  const nextPosZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, dir.z), speed);
  if (!checkCollision(nextPosZ)) camera.position.z = nextPosZ.z;
}

/* =========================
   ТАЧ-СОБЫТИЯ
========================= */
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyId = null, joyRect = null;
let lookId = null, lastTouchX = 0, lastTouchY = 0;

joy.addEventListener('pointerdown', e => {
  joyId = e.pointerId;
  joy.setPointerCapture(joyId);
  joyRect = joy.getBoundingClientRect();
  updateJoy(e);
});

joy.addEventListener('pointermove', e => {
  if (e.pointerId === joyId) updateJoy(e);
});

function updateJoy(e) {
  let dx = e.clientX - (joyRect.left + joyRect.width/2);
  let dy = e.clientY - (joyRect.top + joyRect.height/2);
  const max = joyRect.width * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx / max;
  moveY = dy / max;
}

function resetJoy() {
  joyId = null; moveX = 0; moveY = 0;
  knob.style.transform = 'translate(-50%, -50%)';
}
joy.addEventListener('pointerup', resetJoy);
joy.addEventListener('pointercancel', resetJoy);

window.addEventListener('pointerdown', e => {
  if (e.target === joy || joy.contains(e.target) || e.target.id === 'fs') return;
  if (e.clientX > window.innerWidth * 0.3) {
    lookId = e.pointerId;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === lookId) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;

    yaw -= dx * 0.004;
    pitch -= dy * 0.004;
    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
  }
});

window.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */
let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  updatePlayer(dt);
  renderer.render(scene, camera);

  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
});

setTimeout(() => document.getElementById('hint').classList.add('hide'), 4000);

requestAnimationFrame(animate);
</script>
</body>
</html>
