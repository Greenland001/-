<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Питомец</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1b1330;--panel:#2a1f47;--ink:#f3ecff;--dim:#a99bcf;--acc:#ff7ab8;--bad:#ff5d6c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efff;--panel:#e6d8fb;--ink:#2a1650;--dim:#6b5a92;--acc:#d8358a;--bad:#c81e3a;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1b1330;--panel:#2a1f47;--ink:#f3ecff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stats{display:none;gap:8px;padding:12px 14px 0}
.stat{flex:1;font-size:12px;color:var(--dim)}
.bar{height:8px;border-radius:6px;background:var(--panel);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .4s}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
svg{width:min(78vw,300px);height:auto;overflow:visible}
#body{animation:bob 3.2s ease-in-out infinite;transform-origin:150px 260px}
@keyframes bob{50%{transform:translateY(-8px) scaleY(1.03)}}
@media (prefers-reduced-motion:reduce){#body{animation:none}}
#lids{fill:var(--bg);transition:transform .15s}
#box{margin:0 14px;background:var(--panel);border-radius:18px;padding:16px;min-height:88px;font-size:18px;line-height:1.4}
#box.creep{color:var(--bad)}
#ui{padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
#ask{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--panel);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
button{font:inherit;font-size:17px;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#2a0a1c;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink)}
.row{display:flex;gap:8px}.row button{flex:1;background:var(--panel);color:var(--ink)}
.row button:active,button:active{transform:scale(.97)}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{flex:1;min-width:40%}
#reset{background:none;color:var(--dim);font-size:12px;font-weight:400;padding:4px}
</style>
</head>
<body>
<div id="stats">
  <div class="stat">Сытость<div class="bar"><i id="b-food"></i></div></div>
  <div class="stat">Веселье<div class="bar"><i id="b-fun"></i></div></div>
  <div class="stat">Сон<div class="bar"><i id="b-sleep"></i></div></div>
  <div class="stat">Доверие<div class="bar"><i id="b-love"></i></div></div>
</div>
<div id="stage">
<svg viewBox="0 0 300 300" aria-label="Питомец">
  <g id="body">
    <ellipse cx="150" cy="268" rx="90" ry="12" fill="#000" opacity=".25"/>
    <path id="skin" d="M150 40C90 40 50 95 50 165c0 65 45 105 100 105s100-40 100-105C250 95 210 40 150 40Z" fill="#ff9ecb"/>
    <ellipse cx="105" cy="205" rx="18" ry="10" fill="#ff5d9a" opacity=".35"/>
    <ellipse cx="195" cy="205" rx="18" ry="10" fill="#ff5d9a" opacity=".35"/>
    <circle cx="112" cy="150" r="30" fill="#fff"/><circle cx="188" cy="150" r="30" fill="#fff"/>
    <circle id="pl" cx="112" cy="150" r="14" fill="#1b1330"/><circle id="pr" cx="188" cy="150" r="14" fill="#1b1330"/>
    <g id="lids"><rect x="78" y="118" width="68" height="0" id="ll"/><rect x="154" y="118" width="68" height="0" id="lr"/></g>
    <path id="mouth" d="M128 218q22 18 44 0" fill="none" stroke="#1b1330" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
</div>
<div id="box"></div>
<div id="ui"></div>

<script>
const $=id=>document.getElementById(id);
const box=$('box'),ui=$('ui');
const COLORS={'Розовый':'#ff9ecb','Голубой':'#8fd3ff','Мятный':'#8ff0c4','Жёлтый':'#ffe27a'};
let S={name:'',age:'',color:'Розовый',food:80,fun:80,sleep:80,love:30,step:'name',t:Date.now()};
try{const r=localStorage.getItem('pet1');if(r)S={...S,...JSON.parse(r)}}catch(e){}
function save(){try{S.t=Date.now();localStorage.setItem('pet1',JSON.stringify(S))}catch(e){}}

// typewriter
let tw=0;
function say(text,creep){
  clearTimeout(tw);box.textContent='';box.className=creep?'creep':'';
  let i=0;(function n(){box.textContent=text.slice(0,++i);if(i<text.length)tw=setTimeout(n,28)})();
}
function clear(){ui.innerHTML=''}
function ask(ph,cb,type){
  clear();
  const d=document.createElement('div');d.id='ask';
  d.innerHTML='<input maxlength="20" placeholder="'+ph+'" '+(type?'inputmode="numeric"':'')+'><button>Ок</button>';
  ui.appendChild(d);
  const inp=d.querySelector('input'),go=()=>{const v=inp.value.trim();if(v)cb(v)};
  d.querySelector('button').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
}
function opts(list,cb){
  clear();const d=document.createElement('div');d.className='opts';
  list.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>cb(l);d.appendChild(b)});
  ui.appendChild(d);
}
function setColor(){$('skin').setAttribute('fill',COLORS[S.color]||'#ff9ecb')}

// onboarding
function start(){
  setColor();
  if(S.step==='name'){
    say('Привет... Ты наконец пришёл. Я тебя ждал. Как тебя зовут?');
    ask('Твоё имя',v=>{S.name=v;S.step='age';save();start()});
  }else if(S.step==='age'){
    say('Красивое имя, '+S.name+'. Я запомню его навсегда. Сколько тебе лет?');
    ask('Возраст',v=>{S.age=v;S.step='color';save();start()},1);
  }else if(S.step==='color'){
    say('Мне '+S.age+' — это тоже мои любимые числа. Какой цвет мне выбрать?');
    opts(Object.keys(COLORS),c=>{S.color=c;setColor();S.step='play';save();start()});
  }else{main()}
}

// main
const talk=[
 n=>'Ты пришёл, '+n+'. Я так рад.',
 n=>n+', давай поиграем?',
 n=>'Мне нравится, как ты нажимаешь на экран.',
 n=>'Расскажи мне что-нибудь, '+n+'.',
 n=>'Ты ведь не уйдёшь надолго?'
];
const creepy=[
 n=>n+'... я вижу тебя.',
 n=>'Не закрывай приложение, '+n+'. Пожалуйста.',
 n=>'Здесь так тихо, когда тебя нет.',
 n=>'Я знаю, что ты сейчас держишь телефон.'
];
function main(){
  $('stats').style.display='flex';
  // offline decay
  const mins=Math.min((Date.now()-S.t)/60000,240);
  S.food-=mins*.3;S.fun-=mins*.3;S.sleep-=mins*.1;S.love-=mins*.15;
  clampAll();draw();
  if(mins>10)say('Тебя не было '+Math.round(mins)+' минут, '+S.name+'. Я считал каждую.',true);
  else say('Привет, '+S.name+'!');
  clear();
  const r=document.createElement('div');r.className='row';
  [['🍎 Еда',feed],['🎈 Игра',play],['💤 Сон',sleep],['💬 Слова',chat]].forEach(([t,f])=>{
    const b=document.createElement('button');b.textContent=t;b.onclick=f;r.appendChild(b)});
  ui.appendChild(r);
  const rs=document.createElement('button');rs.id='reset';rs.textContent='Начать заново';
  rs.onclick=()=>{if(confirm('Стереть питомца?')){try{localStorage.removeItem('pet1')}catch(e){}location.reload()}};
  ui.appendChild(rs);
}
function clampAll(){['food','fun','sleep','love'].forEach(k=>S[k]=Math.max(0,Math.min(100,S[k])))}
function draw(){
  clampAll();
  $('b-food').style.width=S.food+'%';$('b-fun').style.width=S.fun+'%';
  $('b-sleep').style.width=S.sleep+'%';$('b-love').style.width=S.love+'%';
  const sad=Math.min(S.food,S.fun,S.love)<25;
  $('mouth').setAttribute('d',sad?'M128 232q22 -18 44 0':'M128 218q22 18 44 0');
  save();
}
function feed(){if(S.food>95){say('Я уже сыт, '+S.name+'. Хотя... спасибо.');return}S.food+=25;S.love+=3;draw();say('Ням! Вкусно, '+S.name+'!')}
function play(){if(S.sleep<15){say('Я слишком хочу спать...');return}S.fun+=25;S.sleep-=8;S.food-=6;S.love+=5;draw();say('Ура! Ещё! Ещё!')}
function sleep(){
  say('Спокойной ночи... Только не уходи.');
  blink(true);S.sleep=100;S.love+=2;draw();
  setTimeout(()=>{blink(false);say('Я не спал. Я смотрел на тебя.',true)},2500);
}
function chat(){
  const pool=S.love>60&&Math.random()<.5?creepy:talk;
  const t=pool[Math.floor(Math.random()*pool.length)](S.name);
  S.love+=2;draw();say(t,pool===creepy);
}
// eyes
function look(x,y){
  const svg=document.querySelector('svg').getBoundingClientRect();
  const cx=svg.left+svg.width*.5,cy=svg.top+svg.height*.5;
  let dx=x-cx,dy=y-cy;const d=Math.hypot(dx,dy)||1,m=Math.min(9,d/12);
  dx=dx/d*m;dy=dy/d*m;
  $('pl').setAttribute('cx',112+dx);$('pl').setAttribute('cy',150+dy);
  $('pr').setAttribute('cx',188+dx);$('pr').setAttribute('cy',150+dy);
}
addEventListener('pointermove',e=>look(e.clientX,e.clientY));
addEventListener('touchmove',e=>{const t=e.touches[0];look(t.clientX,t.clientY)},{passive:true});
function blink(on){['ll','lr'].forEach(id=>$(id).setAttribute('height',on?64:0))}
setInterval(()=>{if(S.step!=='play')return;blink(true);setTimeout(()=>blink(false),140)},4000);
// tick
setInterval(()=>{if(S.step!=='play')return;S.food-=.4;S.fun-=.5;S.sleep-=.15;S.love-=S.food<20?.3:0;draw()},10000);
setInterval(()=>{if(S.step!=='play'||Math.random()>.35)return;
  const t=(S.food<25?'Я голоден, '+S.name+'...':S.fun<25?'Мне скучно...':talk[Math.floor(Math.random()*talk.length)](S.name));say(t)},25000);
$('stage').addEventListener('click',()=>{if(S.step==='play'){S.love+=1;draw();say('Хи-хи! Щекотно!')}});
start();
</script>
</body>
</html>
