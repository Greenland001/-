<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms — Level 0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17150d;
  font-family:Arial,sans-serif;
  touch-action:none
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none
}

.hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:18px;
  background:rgba(28,26,17,.72);
  color:#eee;
  font-size:17px;
  line-height:1.35;
  backdrop-filter:blur(8px);
  text-align:center;
  max-width:85%;
  transition:opacity .8s
}

.hint.hide{
  opacity:0
}

.fs{
  pointer-events:auto;
  position:absolute;
  right:28px;
  bottom:30px;
  width:82px;
  height:82px;
  border:0;
  border-radius:24px;
  background:rgba(20,19,15,.82);
  color:white;
  font-size:37px
}

.joy{
  pointer-events:auto;
  position:absolute;
  left:34px;
  bottom:35px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(28,27,23,.62);
  border:4px solid rgba(190,190,190,.55);
  box-shadow:
    inset 0 10px 25px rgba(255,255,255,.04),
    0 8px 30px rgba(0,0,0,.2)
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:88px;
  height:88px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(190,190,190,.9);
  box-shadow:0 8px 20px rgba(0,0,0,.3)
}

.portrait{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#15130d;
  color:#eee;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  font-size:20px
}

.portrait b{
  display:block;
  font-size:30px;
  margin-bottom:10px
}

@media (orientation:portrait){
  .portrait{
    display:flex
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">

  <div id="hint" class="hint">
    🕹️ Джойстик — движение • Свайп справа — поворот
  </div>

  <button id="fs" class="fs">
    ⛶
  </button>

  <div id="joy" class="joy">
    <div id="knob" class="knob"></div>
  </div>

</div>

<div class="portrait">
  <div>
    <b>Поверни телефон</b>
    Игра лучше работает в горизонтальном режиме.
  </div>
</div>

<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});

const joy=document.getElementById('joy');
const knob=document.getElementById('knob');
const fs=document.getElementById('fs');
const hint=document.getElementById('hint');


/* =========================
   БОЛЬШАЯ КАРТА
========================= */

const map=[

"############################################################",
"#..........................................................#",
"#..........................................................#",
"#..............#########...................................#",
"#..............#.......#...................................#",
"#..............#.......#.................##########........#",
"#..............#.......#.................#........#........#",
"#..............#.......#.................#........#........#",
"#......................#.................#........#........#",
"#..###########.........#.................#........#........#",
"#..#.........#.........#.................#........#........#",
"#..#.........#.........#.................#........#........#",
"#..#.........#..................##########........#........#",
"#..#.........#..................#................#........##",
"#..#.........##############.....#................#........##",
"#..#...........................#................#........###",
"#..#...........................#................#........###",
"#..#############...............#....#############........##",
"#................#.............#....#...................###",
"#................#.............#....#...................###",
"#................#.............#....#...................###",
"#................#.............#....#......########.....###",
"#................#..................#......#......#.....###",
"#................#..................#......#......#.....###",
"#................##########.........#......#......#.....###",
"#..........................#........#......#......#.....###",
"#..........................#........#...................###",
"#..........############....#........################...###",
"#..........#..........#....#...........................###",
"#..........#..........#....#...........................###",
"#..........#..........#................................###",
"#..........############................................###",
"############################################################"

];

const MW=map[0].length;
const MH=map.length;


/* =========================
   ИГРОК
========================= */

const player={
  x:3.5,
  y:2.7,
  a:0.15
};

const FOV=Math.PI/3;
const MAX_DIST=30;
const PLAYER_R=.20;

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,1.5);

let moveX=0;
let moveY=0;
let lookDX=0;

let keys={};

let last=performance.now();


/* =========================
   ЛАМПЫ
========================= */

const lamps=[];

function isWall(x,y){
  const gx=Math.floor(x);
  const gy=Math.floor(y);

  return(
    gy<0 ||
    gy>=MH ||
    gx<0 ||
    gx>=MW ||
    map[gy][gx]==='#'
  );
}

for(let y=1;y<MH-1;y+=4){

  for(let x=2;x<MW-2;x+=6){

    if(!isWall(x+.5,y+.5)){
      lamps.push({
        x:x+.5,
        y:y+.5
      });
    }

  }

}


/* =========================
   КОЛЛИЗИЯ
========================= */

function blocked(x,y){

  return(
    isWall(x-PLAYER_R,y) ||
    isWall(x+PLAYER_R,y) ||
    isWall(x,y-PLAYER_R) ||
    isWall(x,y+PLAYER_R) ||

    isWall(
      x-PLAYER_R,
      y-PLAYER_R
    ) ||

    isWall(
      x+PLAYER_R,
      y+PLAYER_R
    ) ||

    isWall(
      x-PLAYER_R,
      y+PLAYER_R
    ) ||

    isWall(
      x+PLAYER_R,
      y-PLAYER_R
    )
  );
}


function move(dx,dy){

  const nx=player.x+dx;
  const ny=player.y+dy;

  if(!blocked(nx,player.y))
    player.x=nx;

  if(!blocked(player.x,ny))
    player.y=ny;
}


/* =========================
   RESIZE
========================= */

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,1.5);

  canvas.width=Math.max(
    320,
    Math.floor(W*DPR)
  );

  canvas.height=Math.max(
    240,
    Math.floor(H*DPR)
  );

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );
}

addEventListener('resize',resize);

resize();


/* =========================
   ТЕКСТУРА СТЕН
========================= */

const wallTex=document.createElement('canvas');

wallTex.width=256;
wallTex.height=256;

const wt=wallTex.getContext('2d');

wt.fillStyle='#b9a95d';
wt.fillRect(0,0,256,256);


/* горизонтальные следы обоев */

for(let y=0;y<256;y+=16){

  wt.fillStyle='rgba(70,62,30,.035)';
  wt.fillRect(0,y,256,2);

}


/* вертикальные стыки */

for(let x=0;x<256;x+=32){

  wt.fillStyle='rgba(255,240,160,.035)';
  wt.fillRect(x,0,2,256);

}


/* мелкая неоднородность */

for(let i=0;i<1800;i++){

  const x=Math.random()*256;
  const y=Math.random()*256;

  const a=.025+Math.random()*.055;

  wt.fillStyle=
    `rgba(
      ${70+Math.random()*50},
      ${55+Math.random()*40},
      ${25+Math.random()*30},
      ${a}
    )`;

  wt.fillRect(
    x,
    y,
    1+Math.random()*2,
    1+Math.random()*2
  );
}

const tex=wt.getImageData(
  0,0,256,256
).data;


/* =========================
   УГОЛ
========================= */

function normAng(a){

  a%=Math.PI*2;

  if(a<0)
    a+=Math.PI*2;

  return a;
}


/* =========================
   RAYCAST
========================= */

function castRay(angle){

  const rx=Math.cos(angle);
  const ry=Math.sin(angle);

  let mx=Math.floor(player.x);
  let my=Math.floor(player.y);

  const ddx=Math.abs(
    1/(rx||1e-9)
  );

  const ddy=Math.abs(
    1/(ry||1e-9)
  );

  let stepx;
  let stepy;

  let sdx;
  let sdy;

  if(rx<0){

    stepx=-1;

    sdx=
      (player.x-mx)*ddx;

  }else{

    stepx=1;

    sdx=
      (mx+1-player.x)*ddx;
  }


  if(ry<0){

    stepy=-1;

    sdy=
      (player.y-my)*ddy;

  }else{

    stepy=1;

    sdy=
      (my+1-player.y)*ddy;
  }


  let side=0;
  let dist=MAX_DIST;

  for(let i=0;i<100;i++){

    if(sdx<sdy){

      sdx+=ddx;
      mx+=stepx;
      side=0;

    }else{

      sdy+=ddy;
      my+=stepy;
      side=1;
    }


    if(
      mx<0 ||
      my<0 ||
      mx>=MW ||
      my>=MH
    ){
      break;
    }


    if(map[my][mx]==='#'){

      dist=
        side===0
        ?
        (mx-player.x+(1-stepx)/2)/rx
        :
        (my-player.y+(1-stepy)/2)/ry;

      break;
    }
  }


  return{
    dist:Math.min(
      Math.abs(dist),
      MAX_DIST
    ),

    side,
    mx,
    my
  };
}


/* =========================
   СВЕТ
========================= */

function lampLight(x,y){

  let best=0;

  for(const l of lamps){

    const d=
      Math.hypot(
        x-l.x,
        y-l.y
      );

    if(d<6){

      best=Math.max(
        best,
        1-d/6
      );

    }
  }

  return best;
}


/* =========================
   ОТРИСОВКА
========================= */

function draw(){

  const cw=W;
  const ch=H;


  /* потолок */

  const sky=
    ctx.createLinearGradient(
      0,0,
      0,ch*.55
    );

  sky.addColorStop(
    0,
    '#d0c88e'
  );

  sky.addColorStop(
    .55,
    '#b8ad70'
  );

  sky.addColorStop(
    1,
    '#a99c62'
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,
    cw,ch*.54
  );


  /* пол */

  const floor=
    ctx.createLinearGradient(
      0,ch*.5,
      0,ch
    );

  floor.addColorStop(
    0,
    '#7c7045'
  );

  floor.addColorStop(
    1,
    '#39331f'
  );

  ctx.fillStyle=floor;

  ctx.fillRect(
    0,
    ch*.5,
    cw,
    ch*.5
  );


  /* raycasting */

  const cols=
    Math.min(
      Math.floor(cw*.78),
      900
    );

  const strip=cw/cols;

  const zbuf=
    new Float32Array(cols);


  for(let i=0;i<cols;i++){

    const camera=
      (i+.5)/cols-.5;

    const a=
      player.a+
      camera*FOV;

    const r=
      castRay(a);


    const corrected=
      r.dist*
      Math.cos(
        a-player.a
      );

    zbuf[i]=corrected;


    const wallH=
      Math.min(
        ch*1.65,
        ch*.95/
        (corrected+.0001)
      );

    const top=
      ch*.5-wallH*.5;


    const hitX=
      r.side===0
      ?
      player.y+
      corrected*
      Math.sin(a)
      :
      player.x+
      corrected*
      Math.cos(a);


    const u=
      ((hitX%1)+1)%1;

    const tx=
      Math.floor(u*255);

    const base=
      tx*4;


    let light=
      .72+
      lampLight(
        player.x+
        Math.cos(a)*corrected,

        player.y+
        Math.sin(a)*corrected
      )*.22;


    light*=
      1/(1+corrected*.035);


    if(r.side)
      light*=.84;


    const col=
      tex[base]*
      light;

    const g=
      tex[base+1]*
      light;

    const b=
      tex[base+2]*
      light;


    ctx.fillStyle=
      `rgb(
        ${col|0},
        ${g|0},
        ${b|0}
      )`;

    ctx.fillRect(
      i*strip,
      top,
      strip+1,
      wallH
    );


    /* стыки */

    if(tx%32<2){

      ctx.fillStyle=
        `rgba(
          45,38,18,
          ${.10+
            Math.min(
              corrected/30,
              .12
            )}
        )`;

      ctx.fillRect(
        i*strip,
        top,
        strip+1,
        wallH
      );
    }


    /* плинтус */

    const baseH=
      Math.max(
        2,
        Math.min(
          12,
          8/(corrected*.15+1)
        )
      );

    ctx.fillStyle=
      `rgba(
        74,63,31,
        ${.38/
          (1+corrected*.03)}
      )`;

    ctx.fillRect(
      i*strip,
      top+wallH-baseH,
      strip+1,
      baseH
    );

  }


  drawFloorDetails();

  drawLamps();

  drawVignette();


  /* прицел */

  ctx.strokeStyle=
    'rgba(255,255,255,.75)';

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    cw/2-9,
    ch/2
  );

  ctx.lineTo(
    cw/2+9,
    ch/2
  );

  ctx.moveTo(
    cw/2,
    ch/2-9
  );

  ctx.lineTo(
    cw/2,
    ch/2+9
  );

  ctx.stroke();
}


/* =========================
   ПОЛ
========================= */

function drawFloorDetails(){

  ctx.lineWidth=1;

  for(let y=0;y<8;y++){

    const p=(y+1)/8;

    const sy=
      H*.5+
      H*.5*
      Math.pow(p,1.8);

    ctx.strokeStyle=
      `rgba(
        210,196,126,
        ${.10*(1-p)}
      )`;

    ctx.beginPath();

    ctx.moveTo(
      0,
      sy
    );

    ctx.lineTo(
      W,
      sy
    );

    ctx.stroke();
  }
}


/* =========================
   ЛАМПЫ
========================= */

function drawLamps(){

  for(const l of lamps){

    const dx=
      l.x-player.x;

    const dy=
      l.y-player.y;

    const dist=
      Math.hypot(dx,dy);


    let da=
      normAng(
        Math.atan2(dy,dx)
        -
        player.a
      );


    if(da>Math.PI)
      da-=Math.PI*2;


    if(
      Math.abs(da)>FOV*.62 ||
      dist<.5
    )
      continue;


    const sx=
      W/2+
      (da/FOV)*W;


    const size=
      Math.max(
        3,
        Math.min(
          38,
          22/dist
        )
      );


    const y=
      H*.16+
      dist*.015*H;


    if(
      sx<-40 ||
      sx>W+40
    )
      continue;


    const glow=
      ctx.createRadialGradient(
        sx,y,0,
        sx,y,size*3
      );

    glow.addColorStop(
      0,
      'rgba(255,247,190,.55)'
    );

    glow.addColorStop(
      1,
      'rgba(255,247,190,0)'
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
      sx-size*3,
      y-size*3,
      size*6,
      size*6
    );


    ctx.fillStyle=
      'rgba(255,250,207,.92)';

    ctx.fillRect(
      sx-size,
      y-size*.18,
      size*2,
      size*.36
    );


    ctx.fillStyle=
      'rgba(255,255,235,.6)';

    ctx.fillRect(
      sx-size*.65,
      y-size*.08,
      size*1.3,
      size*.16
    );
  }
}


/* =========================
   ВИНЬЕТКА
========================= */

function drawVignette(){

  const g=
    ctx.createRadialGradient(
      W/2,
      H/2,
      Math.min(W,H)*.22,

      W/2,
      H/2,
      Math.max(W,H)*.72
    );


  g.addColorStop(
    0,
    'rgba(0,0,0,0)'
  );

  g.addColorStop(
    .72,
    'rgba(0,0,0,.08)'
  );

  g.addColorStop(
    1,
    'rgba(0,0,0,.38)'
  );


  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );
}


/* =========================
   UPDATE
========================= */

function update(dt){

  let sx=moveX;
  let sy=moveY;


  if(keys.KeyW||keys.ArrowUp)
    sy-=1;

  if(keys.KeyS||keys.ArrowDown)
    sy+=1;

  if(keys.KeyA||keys.ArrowLeft)
    sx-=1;

  if(keys.KeyD||keys.ArrowRight)
    sx+=1;


  const len=
    Math.hypot(sx,sy);


  if(len>1){

    sx/=len;
    sy/=len;
  }


  const speed=2.25;

  const ca=Math.cos(player.a);
  const sa=Math.sin(player.a);


  move(
    (ca*sy-sa*sx)*
    speed*dt,

    (sa*sy+ca*sx)*
    speed*dt
  );


  player.a=
    normAng(
      player.a+
      lookDX*dt
    );


  lookDX*=
    Math.pow(
      .001,
      dt
    );
}


/* =========================
   GAME LOOP
========================= */

function loop(now){

  const dt=
    Math.min(
      .033,
      (now-last)/1000
    );

  last=now;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}


/* =========================
   ДЖОЙСТИК
========================= */

let joyId=null;
let joyRect=null;


function joySet(e){

  if(!joyRect)
    joyRect=
      joy.getBoundingClientRect();


  let dx=
    e.clientX-
    (
      joyRect.left+
      joyRect.width/2
    );


  let dy=
    e.clientY-
    (
      joyRect.top+
      joyRect.height/2
    );


  const max=
    joyRect.width*.36;


  const len=
    Math.hypot(dx,dy);


  if(len>max){

    dx=
      dx/len*max;

    dy=
      dy/len*max;
  }


  knob.style.transform=
    `translate(
      calc(-50% + ${dx}px),
      calc(-50% + ${dy}px)
    )`;


  moveX=dx/max;
  moveY=dy/max;
}


function joyEnd(){

  joyId=null;

  moveX=0;
  moveY=0;

  knob.style.transform=
    'translate(-50%,-50%)';
}


joy.addEventListener(
  'pointerdown',
  e=>{

    joyId=e.pointerId;

    joy.setPointerCapture(
      joyId
    );

    joyRect=
      joy.getBoundingClientRect();

    joySet(e);
  }
);


joy.addEventListener(
  'pointermove',
  e=>{

    if(e.pointerId===joyId)
      joySet(e);
  }
);


joy.addEventListener(
  'pointerup',
  joyEnd
);


joy.addEventListener(
  'pointercancel',
  joyEnd
);


/* =========================
   ПОВОРОТ
========================= */

let lookId=null;
let lastLookX=0;


addEventListener(
  'pointerdown',
  e=>{

    if(
      e.target===joy ||
      joy.contains(e.target) ||
      e.target===fs
    )
      return;


    if(e.clientX>W*.42){

      lookId=e.pointerId;

      lastLookX=e.clientX;
    }
  }
);


addEventListener(
  'pointermove',
  e=>{

    if(e.pointerId===lookId){

      const dx=
        e.clientX-lastLookX;

      lastLookX=e.clientX;

      player.a=
        normAng(
          player.a+
          dx*.005
        );
    }
  }
);


addEventListener(
  'pointerup',
  e=>{

    if(e.pointerId===lookId)
      lookId=null;
  }
);


/* =========================
   КЛАВИАТУРА
========================= */

addEventListener(
  'keydown',
  e=>{
    keys[e.code]=true;
  }
);

addEventListener(
  'keyup',
  e=>{
    keys[e.code]=false;
  }
);


/* =========================
   FULLSCREEN
========================= */

fs.addEventListener(
  'click',
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement
          .requestFullscreen();
      }


      if(screen.orientation?.lock){

        await screen.orientation
          .lock('landscape');
      }

    }catch(e){}
  }
);


/* =========================
   ПОДСКАЗКА
========================= */

setTimeout(
  ()=>{
    hint.classList.add('hide');
  },
  4500
);


/* =========================
   START
========================= */

requestAnimationFrame(loop);

</script>

</body>
    </html>
