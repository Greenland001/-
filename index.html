<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms 3D</title>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:sans-serif; touch-action:none; }
#webgl-container{ width:100%; height:100%; display:block; }
.hud{ position:fixed; inset:0; pointer-events:none; }

.hint{
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  padding:12px 22px; border-radius:18px; background:rgba(28,26,17,.8);
  color:#eee; font-size:16px; text-align:center; max-width:85%; z-index:10;
}

.fs-btn{
  pointer-events:auto; position:absolute; right:20px; top:20px;
  width:50px; height:50px; border:2px solid rgba(255,255,255,0.3);
  border-radius:12px; background:rgba(20,19,15,.75); color:white; font-size:24px;
  display:flex; align-items:center; justify-content:center;
}

.jump-btn{
  pointer-events:auto; position:absolute; right:30px; bottom:30px;
  width:70px; height:70px; border:2px solid rgba(255,255,255,0.4);
  border-radius:50%; background:rgba(20,19,15,.75); color:white; font-size:26px;
  display:flex; align-items:center; justify-content:center;
}

.joy{
  pointer-events:auto; position:absolute; left:30px; bottom:30px;
  width:140px; height:140px; border-radius:50%; background:rgba(28,27,23,.6);
  border:2px solid rgba(190,190,190,.5);
}

.knob{
  position:absolute; left:50%; top:50%; width:60px; height:60px;
  transform:translate(-50%,-50%); border-radius:50%; background:rgba(190,190,190,.9);
}

.crosshair{
  position:absolute; top:50%; left:50%; width:10px; height:10px;
  transform:translate(-50%,-50%); pointer-events:none;
}
.crosshair::before, .crosshair::after{ content:''; position:absolute; background:rgba(255,255,255,.6); }
.crosshair::before{ top:4px; left:0; width:10px; height:2px; }
.crosshair::after{ top:0; left:4px; width:2px; height:10px; }

#stamina-container {
  position: absolute; bottom: 35px; left: 190px;
  width: 140px; height: 12px; background: rgba(0,0,0,0.6);
  border: 2px solid rgba(255,255,255,0.5); border-radius: 6px; overflow: hidden;
}
#stamina-bar { width: 100%; height: 100%; background: #00ffcc; }

#battery-txt {
  position: absolute; top: 20px; left: 20px;
  color: #fff; font-size: 16px; text-shadow: 1px 1px 3px #000;
}

#inventory-screen {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 2000; pointer-events: auto;
}
.inv-grid {
  display: grid; grid-template-columns: repeat(3, 85px); gap: 12px;
  background: rgba(20,20,20,0.9); padding: 18px; border-radius: 12px; border: 2px solid #555;
}
.inv-slot {
  width: 85px; height: 85px; background: #111; border: 2px solid #444;
  border-radius: 8px; color: #fff; display: flex; align-items: center;
  justify-content: center; font-size: 12px; text-align: center; cursor: pointer;
}

#jumpscare-screen, #win-screen {
  position:fixed; inset:0; display:none; flex-direction:column;
  align-items:center; justify-content:center; z-index:1500; text-align:center; padding:20px;
}
#jumpscare-screen { background:black; color:red; font-family:monospace; }
#win-screen { background:rgba(0,40,0,0.9); color:#75ff75; }

button {
  pointer-events:auto; padding:12px 24px; font-size:16px;
  background:#111; color:#fff; border:2px solid #888; border-radius:8px; cursor:pointer; margin-top:15px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="jumpscare-screen">
  <h1>ВАС ПОЙМАЛИ</h1>
  <button onclick="location.reload()">ПОПРОБОВАТЬ СНОВА</button>
</div>

<div id="win-screen">
  <h1 id="win-title">УРОВЕНЬ ПРОЙДЕН!</h1>
  <button id="continue-btn">ПРОДОЛЖИТЬ</button>
</div>

<div id="inventory-screen">
  <h2 style="color:#fff; margin-bottom:15px;">ИНВЕНТАРЬ (Нажми I для закрытия)</h2>
  <div class="inv-grid" id="inv-grid"></div>
</div>

<div id="webgl-container"></div>

<div class="hud">
  <div id="hint" class="hint">Уровень 1: Найдите выход из лабиринта!</div>
  <div class="crosshair"></div>
  <div id="battery-txt">Фонарик: --</div>

  <div id="stamina-container"><div id="stamina-bar"></div></div>

  <button id="fs" class="fs-btn">⛶</button>
  <div id="jump" class="jump-btn">⬆</div>
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
</div>

<script>
'use strict';

const map = [
  "##################################################",
  "#..E...................#.........................#",
  "#..##################..#..#####################..#",
  "#..#................#..#..#...................#..#",
  "#..#..############..#..#..#..###############..#..#",
  "#..#..#..........#..#..#..#..#.............#..#..#",
  "#..#..#..######..#..#.....#..#..#########..#..#..#",
  "#..#..#..#....#..#..#######..#..#.......#..#..#..#",
  "#.....#..#....#..#...........#..#.......#..#.....#",
  "#####.#..######..#############..#########..#####.#",
  "#.....#....................................#.....#",
  "#..#################..###################..#####.#",
  "#..#...............#..#.................#........#",
  "#..#..###########..#..#..#############..#######..#",
  "#..#..#.........#..#..#..#...........#........#..#",
  "#..#..#..#####..#..#..#..#..#######..#######..#..#",
  "#.....#..#...#..#.....#..#..#.....#........#..#..#",
  "#######..#...#..#######..#..#.....#######..#..#..#",
  "#........#...#...........#..#...........#..#.....#",
  "#..#######...#############..##########..#..#####.#",
  "#..#........................#........#..#......#.#",
  "#..#..####################..#..####..#..#####..#.#",
  "#..#..#..................#..#..#..#..#......#..#.#",
  "#..#..#..##############..#..#..#..#..#####..#..#.#",
  "#     #..#............#..#..#     #......#..#....#",
  "########.#..########..#..#..###########..#..######",
  "#........#..#......#..#..#...............#.......#",
  "#..#######..#......#..#..################........#",
  "#..#........#......#..#..........................#",
  "#..#..#######..#####..##########################.#",
  "#..#..#     #.........#....................#..#..#",
  "#..#..#     ########..#..################..#..#..#",
  "#     #...............#..#..............#.....#..#",
  "#######..##############..#..##########..#######..#",
  "#........#...............#..#........#...........#",
  "#..#######..##############..#..####..##########..#",
  "#................................................#",
  "##################################################"
];

const MW = map[0].length;
const MH = map.length;
const CELL_SIZE = 3;

const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110e);
scene.fog = new THREE.FogExp2(0x11110e, 0.035);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const flashlight = new THREE.SpotLight(0xffffff, 0, 30, Math.PI / 4, 0.5);
camera.add(flashlight);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight.target);
scene.add(camera);

// Текстуры и объекты уровня 1
function createWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#c5b565'; ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = 'rgba(80,70,30,0.15)';
  for(let i=0; i<128; i+=16) ctx.fillRect(0, i, 128, 2);
  return new THREE.CanvasTexture(canvas);
}

const wallMat = new THREE.MeshLambertMaterial({ map: createWallTexture() });
const levelGroup = new THREE.Group();
scene.add(levelGroup);

const floorGeo = new THREE.PlaneGeometry(MW * CELL_SIZE, MH * CELL_SIZE);
const floorMat = new THREE.MeshLambertMaterial({ color: 0x554422 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set((MW * CELL_SIZE)/2, 0, (MH * CELL_SIZE)/2);
levelGroup.add(floor);

const wallGeo = new THREE.BoxGeometry(CELL_SIZE, 3, CELL_SIZE);
const walls = [];
let exitPos = new THREE.Vector3();

for (let y = 0; y < MH; y++) {
  for (let x = 0; x < MW; x++) {
    const posX = x * CELL_SIZE + CELL_SIZE/2;
    const posZ = y * CELL_SIZE + CELL_SIZE/2;
    if (map[y][x] === '#') {
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(posX, 1.5, posZ);
      levelGroup.add(wall);
      walls.push(wall);
    } else if (map[y][x] === 'E') {
      exitPos.set(posX, 1.5, posZ);
    }
  }
}

// Игровые переменные
let currentLevel = 1;
let isGameOver = false;
let stamina = 100;
let runTimer = 0;

const inventory = [];
let hasFlashlight = false;
let flashlightBattery = 0;
let isInvOpen = false;

const items = [];
function spawnItem(type, pos, name) {
  const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const mat = new THREE.MeshBasicMaterial({ color: type === 'flashlight' ? 0xffff00 : 0x0000ff });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData = { type, name };
  scene.add(mesh);
  items.push(mesh);
}

// Предметы на Уровне 1
spawnItem('flashlight', new THREE.Vector3(6, 0.5, 6), 'Фонарик');
spawnItem('battery', new THREE.Vector3(12, 0.5, 6), 'Батарейка (+30%)');

camera.position.set(1.5 * CELL_SIZE, 1.5, 1.5 * CELL_SIZE);

// Инвентарь
window.addEventListener('keydown', e => {
  if (e.code === 'KeyI') toggleInventory();
  if (e.code === 'KeyE') interactItem();
  if (e.code === 'ShiftLeft') isShift = true;
  keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ShiftLeft') isShift = false;
  keys[e.code] = false;
});

const keys = {};
let isShift = false;

function toggleInventory() {
  isInvOpen = !isInvOpen;
  document.getElementById('inventory-screen').style.display = isInvOpen ? 'flex' : 'none';
  if (isInvOpen) renderInventory();
}

function renderInventory() {
  const grid = document.getElementById('inv-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    if (inventory[i]) {
      slot.innerText = inventory[i].name;
      slot.onclick = () => useItem(i);
    } else {
      slot.innerText = '[Пусто]';
    }
    grid.appendChild(slot);
  }
}

function useItem(idx) {
  const item = inventory[idx];
  if (item.type === 'battery' && hasFlashlight) {
    flashlightBattery = Math.min(100, flashlightBattery + 30);
    inventory.splice(idx, 1);
    renderInventory();
  }
}

function interactItem() {
  items.forEach((mesh, idx) => {
    if (mesh.position.distanceTo(camera.position) < 2.5) {
      if (mesh.userData.type === 'flashlight') {
        hasFlashlight = true;
        flashlightBattery = 100;
      } else {
        if (inventory.length < 6) inventory.push(mesh.userData);
      }
      scene.remove(mesh);
      items.splice(idx, 1);
    }
  });
}

// Управление игроком
let moveX = 0, moveY = 0;
let yaw = 0, pitch = 0;

function checkWallCollision(pos) {
  if (currentLevel !== 1) return false;
  for (let wall of walls) {
    const box = new THREE.Box3().setFromObject(wall);
    if (box.containsPoint(pos)) return true;
  }
  return false;
}

function updatePlayer(dt) {
  if (isGameOver || isInvOpen) return;

  // Бег
  let speed = 4.5 * dt;
  const isMoving = moveX !== 0 || moveY !== 0 || keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];
  if (isShift && stamina > 0 && isMoving) {
    speed *= 1.7;
    stamina = Math.max(0, stamina - 30 * dt);
  } else {
    stamina = Math.min(100, stamina + 20 * dt);
  }
  document.getElementById('stamina-bar').style.width = stamina + '%';

  // Фонарик
  if (hasFlashlight && flashlightBattery > 0) {
    flashlightBattery -= 0.5 * dt;
    flashlight.intensity = 2;
    document.getElementById('battery-txt').innerText = `Фонарик: ${Math.ceil(flashlightBattery)}%`;
  } else {
    flashlight.intensity = 0;
    document.getElementById('battery-txt').innerText = hasFlashlight ? 'Фонарик: Разряжен' : 'Фонарик: --';
  }

  // Движение
  let kx = 0, ky = 0;
  if (keys['KeyW']) ky -= 1;
  if (keys['KeyS']) ky += 1;
  if (keys['KeyA']) kx -= 1;
  if (keys['KeyD']) kx += 1;

  const inputX = moveX || kx;
  const inputY = moveY || ky;

  const dir = new THREE.Vector3();
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  dir.addScaledVector(forward, -inputY);
  dir.addScaledVector(side, inputX);

  if (dir.length() > 0) {
    dir.normalize();
    if (currentLevel === 2) {
      runTimer += dt;
      if (runTimer >= 20) {
        runTimer = 0;
        loadLevel3();
      }
    }
  } else {
    if (currentLevel === 2) runTimer = 0;
  }

  const nextPos = camera.position.clone().addScaledVector(dir, speed);
  if (!checkWallCollision(nextPos)) {
    camera.position.x = nextPos.x;
    camera.position.z = nextPos.z;
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Проверка переходов
  if (currentLevel === 1 && camera.position.distanceTo(exitPos) < 1.5) {
    triggerWin();
  } else if (currentLevel === 3 && specialHouse && camera.position.distanceTo(specialHouse.position) < 4.0) {
    loadLevel4();
  }
}

function triggerWin() {
  isGameOver = true;
  document.getElementById('win-screen').style.display = 'flex';
  document.getElementById('continue-btn').onclick = () => {
    document.getElementById('win-screen').style.display = 'none';
    isGameOver = false;
    loadLevel2();
  };
}

// ПЕРЕХОДЫ МЕЖДУ УРОВНЯМИ
function loadLevel2() {
  currentLevel = 2;
  scene.remove(levelGroup); // Убираем лабиринт 1 уровня
  
  scene.background = new THREE.Color(0x60a0ff);
  scene.fog = new THREE.FogExp2(0x60a0ff, 0.005);

  const planeGeo = new THREE.PlaneGeometry(1000, 1000);
  const planeMat = new THREE.MeshLambertMaterial({ color: 0x33aa33 });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  scene.add(plane);

  spawnItem('map', new THREE.Vector3(0, 0.5, -5), 'Карта');
  spawnItem('battery', new THREE.Vector3(10, 0.5, 10), 'Батарейка (+30%)');

  camera.position.set(0, 1.5, 0);
  document.getElementById('hint').innerText = "Идите 20 секунд без остановки, чтобы сбежать!";
}

let specialHouse = null;
function loadLevel3() {
  currentLevel = 3;
  scene.background = new THREE.Color(0x111115);
  scene.fog = new THREE.FogExp2(0x111115, 0.015);

  const houseGeo = new THREE.BoxGeometry(8, 6, 8);
  const houseMat = new THREE.MeshLambertMaterial({ color: 0x444444 });

  for (let x = -150; x <= 150; x += 25) {
    for (let z = -150; z <= 150; z += 25) {
      if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
      const house = new THREE.Mesh(houseGeo, houseMat);
      house.position.set(x, 3, z);
      scene.add(house);
    }
  }

  // Особый дом с красной дверью
  const specialMat = new THREE.MeshLambertMaterial({ color: 0x8b0000 });
  specialHouse = new THREE.Mesh(houseGeo, specialMat);
  specialHouse.position.set(40, 3, 40);
  scene.add(specialHouse);

  camera.position.set(0, 1.5, 0);
  document.getElementById('hint').innerText = "Найдите отличающийся дом с дверью!";
}

function loadLevel4() {
  currentLevel = 4;
  scene.background = new THREE.Color(0x44ccff);
  scene.fog = new THREE.FogExp2(0x44ccff, 0.008);

  const poolGeo = new THREE.PlaneGeometry(500, 500);
  const poolMat = new THREE.MeshStandardMaterial({ color: 0x0088aa, roughness: 0.1 });
  const poolFloor = new THREE.Mesh(poolGeo, poolMat);
  poolFloor.rotation.x = -Math.PI / 2;
  scene.add(poolFloor);

  const colGeo = new THREE.CylinderGeometry(1.2, 1.2, 15);
  const colMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let x = -150; x <= 150; x += 20) {
    for (let z = -150; z <= 150; z += 20) {
      const col = new THREE.Mesh(colGeo, colMat);
      col.position.set(x, 7.5, z);
      scene.add(col);
    }
  }

  camera.position.set(0, 1.8, 0);
  document.getElementById('hint').innerText = "УРОВЕНЬ 4: Бесконечный бассейн";
}

// Тач-управление
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
let joyId = null, joyRect = null, lookId = null, lastTouchX = 0, lastTouchY = 0;

document.getElementById('fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

joy.addEventListener('pointerdown', e => {
  joyId = e.pointerId; joy.setPointerCapture(joyId);
  joyRect = joy.getBoundingClientRect(); updateJoy(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) updateJoy(e); });
function updateJoy(e) {
  let dx = e.clientX - (joyRect.left + joyRect.width/2);
  let dy = e.clientY - (joyRect.top + joyRect.height/2);
  const max = joyRect.width * 0.35;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = (dx/len)*max; dy = (dy/len)*max; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  moveX = dx / max; moveY = dy / max;
}
joy.addEventListener('pointerup', () => { joyId = null; moveX = 0; moveY = 0; knob.style.transform = 'translate(-50%, -50%)'; });

window.addEventListener('pointerdown', e => {
  if (e.target.closest('#joy') || e.target.closest('#jump') || e.target.closest('#fs')) return;
  if (e.clientX > window.innerWidth * 0.3) { lookId = e.pointerId; lastTouchX = e.clientX; lastTouchY = e.clientY; }
});

window.addEventListener('pointermove', e => {
  if (e.pointerId === lookId) {
    yaw -= (e.clientX - lastTouchX) * 0.004;
    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch - (e.clientY - lastTouchY) * 0.004));
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  }
});
window.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });

let lastTime = performance.now();
function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  updatePlayer(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
