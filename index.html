<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Backrooms — Level 0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17150d;
  font-family:Arial,sans-serif;
  touch-action:none
}

canvas{
  display:block;
  width:100%;
  height:100%
}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none
}

.hint{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 22px;
  border-radius:18px;
  background:rgba(28,26,17,.72);
  color:#eee;
  font-size:17px;
  line-height:1.35;
  backdrop-filter:blur(8px);
  text-align:center;
  max-width:85%;
  transition:opacity .8s
}

.hint.hide{
  opacity:0
}

.fs{
  pointer-events:auto;
  position:absolute;
  right:28px;
  bottom:30px;
  width:82px;
  height:82px;
  border:0;
  border-radius:24px;
  background:rgba(20,19,15,.82);
  color:white;
  font-size:37px
}

.joy{
  pointer-events:auto;
  position:absolute;
  left:34px;
  bottom:35px;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(28,27,23,.62);
  border:4px solid rgba(190,190,190,.55);
  box-shadow:
    inset 0 10px 25px rgba(255,255,255,.04),
    0 8px 30px rgba(0,0,0,.2)
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:88px;
  height:88px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(190,190,190,.9);
  box-shadow:0 8px 20px rgba(0,0,0,.3)
}

.portrait{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#15130d;
  color:#eee;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  font-size:20px
}

.portrait b{
  display:block;
  font-size:30px;
  margin-bottom:10px
}

@media (orientation:portrait){
  .portrait{
    display:flex
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">
  <div id="hint" class="hint">
    🕹️ Джойстик — движение • Свайп справа — поворот
  </div>

  <button id="fs" class="fs">⛶</button>

  <div id="joy" class="joy">
    <div id="knob" class="knob"></div>
  </div>
</div>

<div class="portrait">
  <div>
    <b>Поверни телефон</b>
    Игра лучше работает в горизонтальном режиме.
  </div>
</div>

<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});

const joy=document.getElementById('joy');
const knob=document.getElementById('knob');
const fs=document.getElementById('fs');
const hint=document.getElementById('hint');


/* =========================
   КАРТА
========================= */

const map=[
"############################################################",
"#..........................................................#",
"#..........................................................#",
"#..............#########...................................#",
"#..............#.......#...................................#",
"#..............#.......#.................##########........#",
"#..............#.......#.................#........#........#",
"#..............#.......#.................#........#........#",
"#......................#.................#........#........#",
"#..###########.........#.................#........#........#",
"#..#.........#.........#.................#........#........#",
"#..#.........#..................##########........#........#",
"#..#.........#..................#................#........##",
"#..#.........##############.....#................#........##",
"#..#...........................#................#........###",
"#..#...........................#................#........###",
"#..#############...............#....#############........##",
"#................#.............#....#...................###",
"#................#.............#....#...................###",
"#................#.............#....#...................###",
"#................#.............#....#......########.....###",
"#................#..................#......#......#.....###",
"#................#..................#......#......#.....###",
"#................##########.........#......#......#.....###",
"#..........................#........#......#......#.....###",
"#..........................#........#...................###",
"#..........############....#........################...###",
"#..........#..........#....#...........................###",
"#..........#..........#....#...........................###",
"#..........#..........#................................###",
"#..........############................................###",
"############################################################"
];

const MW=map[0].length;
const MH=map.length;


/* =========================
   ИГРОК
========================= */

const player={
  x:3.5,
  y:2.7,
  a:0.15
};

const FOV=Math.PI/3;
const MAX_DIST=30;
const PLAYER_R=.20;

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,1.5);

let moveX=0;
let moveY=0;
let lookDX=0;

let keys={};
let last=performance.now();

let depthBuffer=[];


/* =========================
   ПРОВЕРКИ СТЕН
========================= */

function isWall(x,y){
  const gx=Math.floor(x);
  const gy=Math.floor(y);

  if(
    gy<0 ||
    gy>=MH ||
    gx<0 ||
    gx>=MW
  ) return true;

  return map[gy][gx]==='#';
}


function blocked(x,y){

  return(
    isWall(x-PLAYER_R,y) ||
    isWall(x+PLAYER_R,y) ||
    isWall(x,y-PLAYER_R) ||
    isWall(x,y+PLAYER_R) ||

    isWall(
      x-PLAYER_R,
      y-PLAYER_R
    ) ||

    isWall(
      x+PLAYER_R,
      y+PLAYER_R
    ) ||

    isWall(
      x-PLAYER_R,
      y+PLAYER_R
    ) ||

    isWall(
      x+PLAYER_R,
      y-PLAYER_R
    )
  );
}


function move(dx,dy){

  const nx=player.x+dx;
  const ny=player.y+dy;

  if(!blocked(nx,player.y)){
    player.x=nx;
  }

  if(!blocked(player.x,ny)){
    player.y=ny;
  }
}


/* =========================
   ЛАМПЫ
========================= */

const lamps=[];

for(let y=1;y<MH-1;y+=4){

  for(let x=2;x<MW-2;x+=6){

    if(!isWall(x+.5,y+.5)){

      lamps.push({
        x:x+.5,
        y:y+.5
      });

    }

  }
}


/* =========================
   RESIZE
========================= */

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(
    devicePixelRatio||1,
    1.5
  );

  canvas.width=Math.max(
    320,
    Math.floor(W*DPR)
  );

  canvas.height=Math.max(
    240,
    Math.floor(H*DPR)
  );

  ctx.setTransform(
    DPR,0,
    0,DPR,
    0,0
  );
}

addEventListener('resize',resize);

resize();


/* =========================
   ТЕКСТУРА СТЕН
========================= */

const wallTex=document.createElement('canvas');

wallTex.width=256;
wallTex.height=256;

const wt=wallTex.getContext('2d');

const wallGradient=
  wt.createLinearGradient(
    0,0,256,0
  );

wallGradient.addColorStop(
  0,
  '#a99a54'
);

wallGradient.addColorStop(
  .25,
  '#c0b267'
);

wallGradient.addColorStop(
  .55,
  '#b3a35a'
);

wallGradient.addColorStop(
  .8,
  '#c4b66b'
);

wallGradient.addColorStop(
  1,
  '#a79a53'
);

wt.fillStyle=wallGradient;

wt.fillRect(
  0,0,256,256
);


/* горизонтальные полосы */

for(let y=0;y<256;y+=16){

  wt.fillStyle=
    'rgba(70,60,25,.10)';

  wt.fillRect(
    0,y,256,2
  );

  wt.fillStyle=
    'rgba(255,245,170,.07)';

  wt.fillRect(
    0,y+2,256,2
  );
}


/* вертикальные полосы */

for(let x=0;x<256;x+=32){

  wt.fillStyle=
    'rgba(65,55,25,.13)';

  wt.fillRect(
    x,0,2,256
  );

  wt.fillStyle=
    'rgba(245,230,150,.08)';

  wt.fillRect(
    x+2,0,2,256
  );
}


/* мелкие пятна */

for(let i=0;i<170;i++){

  const x=Math.random()*256;
  const y=Math.random()*256;
  const w=4+Math.random()*30;
  const h=2+Math.random()*18;

  wt.fillStyle=
    `rgba(70,55,20,${.025+Math.random()*.07})`;

  wt.beginPath();

  wt.ellipse(
    x,y,w,h,
    Math.random()*Math.PI,
    0,
    Math.PI*2
  );

  wt.fill();
}


/* шум */

for(let i=0;i<900;i++){

  const x=Math.random()*256;
  const y=Math.random()*256;

  wt.fillStyle=
    Math.random()<.55
    ? 'rgba(255,245,170,.035)'
    : 'rgba(50,40,15,.045)';

  wt.fillRect(
    x,
    y,
    1+Math.random()*2,
    1+Math.random()*2
  );
}


/* =========================
   RAYCAST
========================= */

function castRay(angle){

  const rx=Math.cos(angle);
  const ry=Math.sin(angle);

  let mx=Math.floor(player.x);
  let my=Math.floor(player.y);

  const ddx=Math.abs(
    1/(rx||1e-9)
  );

  const ddy=Math.abs(
    1/(ry||1e-9)
  );

  let stepx;
  let stepy;
  let sdx;
  let sdy;

  if(rx<0){

    stepx=-1;

    sdx=
      (player.x-mx)*ddx;

  }else{

    stepx=1;

    sdx=
      (mx+1-player.x)*ddx;
  }


  if(ry<0){

    stepy=-1;

    sdy=
      (player.y-my)*ddy;

  }else{

    stepy=1;

    sdy=
      (my+1-player.y)*ddy;
  }


  let side=0;
  let dist=MAX_DIST;

  for(let i=0;i<100;i++){

    if(sdx<sdy){

      sdx+=ddx;
      mx+=stepx;
      side=0;

    }else{

      sdy+=ddy;
      my+=stepy;
      side=1;
    }


    if(
      mx<0 ||
      my<0 ||
      mx>=MW ||
      my>=MH
    ) break;


    if(map[my][mx]==='#'){

      dist=
        side===0
        ? (
          mx-player.x+
          (1-stepx)/2
        )/rx
        : (
          my-player.y+
          (1-stepy)/2
        )/ry;

      break;
    }
  }

  return{
    dist:Math.min(
      Math.abs(dist),
      MAX_DIST
    ),

    side,
    mx,
    my
  };
}


/* =========================
   ОСВЕЩЕНИЕ
========================= */

function lampLight(x,y){

  let best=0;

  for(const l of lamps){

    const d=
      Math.hypot(
        x-l.x,
        y-l.y
      );

    if(d<6.5){

      const power=
        1-d/6.5;

      best=
        Math.max(
          best,
          power
        );
    }
  }

  return Math.pow(
    best,
    .65
  );
}


/* =========================
   ОСНОВНАЯ ОТРИСОВКА
========================= */

function draw(){

  const cw=W;
  const ch=H;


  /* НЕБО */

  const sky=
    ctx.createLinearGradient(
      0,0,
      0,ch*.52
    );

  sky.addColorStop(
    0,
    '#d0c88e'
  );

  sky.addColorStop(
    .55,
    '#b8ad70'
  );

  sky.addColorStop(
    1,
    '#a99c62'
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,
    cw,ch*.54
  );


  /* ПОЛ */

  const floor=
    ctx.createLinearGradient(
      0,ch*.5,
      0,ch
    );

  floor.addColorStop(
    0,
    '#81764a'
  );

  floor.addColorStop(
    .5,
    '#625938'
  );

  floor.addColorStop(
    1,
    '#39331f'
  );

  ctx.fillStyle=floor;

  ctx.fillRect(
    0,
    ch*.5,
    cw,
    ch*.5
  );


  /* СТЕНЫ */

  const cols=
    Math.min(
      Math.floor(cw*.78),
      900
    );

  const strip=cw/cols;

  depthBuffer.length=cols;


  for(let i=0;i<cols;i++){

    const camera=
      (i+.5)/cols-.5;

    const angle=
      player.a+
      camera*FOV;

    const r=
      castRay(angle);

    const corrected=
      r.dist*
      Math.cos(
        angle-player.a
      );

    depthBuffer[i]=corrected;


    const wallH=
      Math.min(
        ch*1.65,
        ch*.95/
        (corrected+.0001)
      );

    const top=
      ch*.5-
      wallH*.5;


    const hitX=
      r.side===0
      ? player.y+
        r.dist*Math.sin(angle)
      : player.x+
        r.dist*Math.cos(angle);

    const hitY=
      r.side===0
      ? player.x+
        r.dist*Math.cos(angle)
      : player.y+
        r.dist*Math.sin(angle);


    let u=
      r.side===0
      ? hitX%1
      : hitY%1;

    if(u<0)u+=1;

    let tx=
      Math.floor(
        u*255
      );


    if(
      (r.side===0 &&
       Math.cos(angle)>0)
      ||
      (r.side===1 &&
       Math.sin(angle)<0)
    ){

      tx=255-tx;
    }


    ctx.drawImage(
      wallTex,
      tx,0,1,256,
      i*strip,
      top,
      strip+1,
      wallH
    );


    /* свет */

    const lamp=
      lampLight(
        hitX,
        hitY
      );

    let light=
      .42+
      lamp*.78;

    light*=
      1/
      (1+
       corrected*.025);

    if(r.side){
      light*=.82;
    }

    light=
      Math.max(
        .25,
        Math.min(1.15,light)
      );


    const darkness=
      1-light;

    if(darkness>.01){

      ctx.fillStyle=
        `rgba(20,16,8,${Math.min(
          .72,
          darkness
        )})`;

      ctx.fillRect(
        i*strip,
        top,
        strip+1,
        wallH
      );
    }


    /* дальний туман */

    const fog=
      Math.max(
        0,
        Math.min(
          .22,
          (corrected-7)/35
        )
      );

    if(fog>.01){

      ctx.fillStyle=
        `rgba(48,42,22,${fog})`;

      ctx.fillRect(
        i*strip,
        top,
        strip+1,
        wallH
      );
    }


    /* нижняя тень стены */

    const baseH=
      Math.max(
        2,
        Math.min(
          12,
          8/
          (corrected*.15+1)
        )
      );

    ctx.fillStyle=
      `rgba(74,63,31,${.38/
      (1+corrected*.03)})`;

    ctx.fillRect(
      i*strip,
      top+wallH-baseH,
      strip+1,
      baseH
    );
  }


  drawPerspectiveFloor();
  drawLamps();
  drawVignette();


  /* прицел */

  ctx.strokeStyle=
    'rgba(255,255,255,.75)';

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    cw/2-9,
    ch/2
  );

  ctx.lineTo(
    cw/2+9,
    ch/2
  );

  ctx.moveTo(
    cw/2,
    ch/2-9
  );

  ctx.lineTo(
    cw/2,
    ch/2+9
  );

  ctx.stroke();
}


/* =========================
   ПЕРСПЕКТИВНЫЙ ПОЛ
========================= */

function drawPerspectiveFloor(){

  const horizon=
    H*.505;

  const centerX=
    W/2;


  /* горизонтальные швы */

  for(let i=1;i<=16;i++){

    const p=i/16;

    const y=
      horizon+
      (H-horizon)*
      Math.pow(
        p,
        1.75
      );

    const alpha=
      .16*(1-p)+.025;

    ctx.strokeStyle=
      `rgba(220,204,135,${alpha})`;

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
      0,y
    );

    ctx.lineTo(
      W,y
    );

    ctx.stroke();
  }


  /* линии перспективы */

  for(let i=-9;i<=9;i++){

    if(i===0)continue;

    const bottomX=
      centerX+
      i*W*.105;

    ctx.strokeStyle=
      'rgba(205,190,120,.075)';

    ctx.beginPath();

    ctx.moveTo(
      centerX,
      horizon
    );

    ctx.lineTo(
      bottomX,
      H
    );

    ctx.stroke();
  }
}


/* =========================
   ЛАМПЫ
========================= */

function drawLamps(){

  const focal=
    (W/2)/
    Math.tan(FOV/2);

  const lampHeight=.22;


  for(const l of lamps){

    const dx=
      l.x-player.x;

    const dy=
      l.y-player.y;


    /* координаты относительно камеры */

    const forward=
      dx*Math.cos(player.a)+
      dy*Math.sin(player.a);

    const side=
      -dx*Math.sin(player.a)+
      dy*Math.cos(player.a);


    if(forward<=.25)continue;


    const sx=
      W/2+
      (side/forward)*
      focal;

    const sy=
      H*.50-
      (lampHeight/
       forward)*
      focal;


    const size=
      Math.max(
        2,
        Math.min(
          42,
          9*focal/forward
        )
      );


    if(
      sx<-50 ||
      sx>W+50 ||
      sy<-50 ||
      sy>H
    )continue;


    /* проверяем стену перед лампой */

    const column=
      Math.floor(
        (sx/W)*
        depthBuffer.length
      );

    if(
      column>=0 &&
      column<depthBuffer.length
    ){

      const wallDepth=
        depthBuffer[column];

      if(
        wallDepth<
        forward-.12
      ){
        continue;
      }
    }


    /* свечение */

    const glow=
      ctx.createRadialGradient(
        sx,
        sy,
        0,
        sx,
        sy,
        size*3
      );

    glow.addColorStop(
      0,
      'rgba(255,247,190,.65)'
    );

    glow.addColorStop(
      .35,
      'rgba(255,239,150,.25)'
    );

    glow.addColorStop(
      1,
      'rgba(255,247,190,0)'
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
      sx-size*3,
      sy-size*3,
      size*6,
      size*6
    );


    /* сама лампа */

    ctx.fillStyle=
      'rgba(255,250,207,.95)';

    ctx.fillRect(
      sx-size,
      sy-size*.18,
      size*2,
      size*.36
    );


    ctx.fillStyle=
      'rgba(255,255,235,.75)';

    ctx.fillRect(
      sx-size*.65,
      sy-size*.08,
      size*1.3,
      size*.16
    );
  }
}


/* =========================
   ВИНЬЕТКА
========================= */

function drawVignette(){

  const g=
    ctx.createRadialGradient(
      W/2,
      H/2,
      Math.min(W,H)*.22,
      W/2,
      H/2,
      Math.max(W,H)*.72
    );

  g.addColorStop(
    0,
    'rgba(0,0,0,0)'
  );

  g.addColorStop(
    .72,
    'rgba(0,0,0,.08)'
  );

  g.addColorStop(
    1,
    'rgba(0,0,0,.38)'
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );
}


/* =========================
   УПРАВЛЕНИЕ
========================= */
