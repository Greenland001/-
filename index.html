<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Backrooms</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* Экран для вертикального телефона */

#portrait{
    position:fixed;
    inset:0;
    z-index:50;

    background:#151515;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    text-align:center;
}

#portrait .box{
    font-size:23px;
    padding:25px;
}

#portrait small{
    display:block;
    margin-top:10px;
    color:#aaa;
}

#rotate{
    margin-top:20px;
    padding:14px 20px;

    border:0;
    border-radius:15px;

    background:#333;
    color:white;

    font-size:17px;
}


/* Джойстик */

#joy{
    position:fixed;

    left:30px;
    bottom:30px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(40,40,40,.7);

    border:3px solid #888;

    z-index:10;
}

#knob{
    position:absolute;

    left:50%;
    top:50%;

    width:76px;
    height:76px;

    margin-left:-38px;
    margin-top:-38px;

    border-radius:50%;

    background:#aaa;

    box-shadow:0 3px 15px #0008;
}


/* Область для поворота */

#look{
    position:fixed;

    right:0;
    top:0;

    width:62%;
    height:100%;

    z-index:5;
}


/* Полноэкранная кнопка */

#fs{
    position:fixed;

    right:22px;
    bottom:22px;

    z-index:15;

    width:64px;
    height:64px;

    border:0;
    border-radius:18px;

    background:#080808cc;

    color:white;

    font-size:28px;
}


/* Подсказка */

#hint{
    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:15;

    color:#ddd;

    background:#0009;

    padding:9px 15px;

    border-radius:12px;

    font-size:15px;

    pointer-events:none;
}


/* Только вертикальный экран */

@media (orientation:portrait){

    #portrait{
        display:flex;
    }

}

@media (orientation:landscape){

    #portrait{
        display:none;
    }

}

</style>
</head>

<body>

<div id="game">

<canvas id="c"></canvas>

</div>


<div id="portrait">

    <div class="box">

        📱

        <br><br>

        <b>Поверни телефон горизонтально</b>

        <small>
            Игра рассчитана на горизонтальный экран.
        </small>

        <button id="rotate">
            ↔ Попробовать повернуть
        </button>

    </div>

</div>


<div id="hint">
    🕹️ Джойстик — движение • Свайп справа — поворот
</div>


<div id="joy">

    <div id="knob"></div>

</div>


<div id="look"></div>


<button id="fs">
    ⛶
</button>


<script>

"use strict";


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("c");

const ctx =
canvas.getContext("2d");


let W=0;
let H=0;
let DPR=1;


function resize(){

    DPR=Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W=Math.max(
        320,
        Math.floor(innerWidth)
    );

    H=Math.max(
        180,
        Math.floor(innerHeight)
    );

    canvas.width=
        Math.floor(W*DPR);

    canvas.height=
        Math.floor(H*DPR);

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();



/* =========================
   КАРТА BACKROOMS
========================= */

const map=[

"########################",

"#......................#",

"#......................#",

"#......####............#",

"#......#...............#",

"#......#........####...#",

"#................#.....#",

"#..########.......#....#",

"#........#.............#",

"#........#..######.....#",

"#........#.............#",

"#........#.............#",

"#......................#",

"#.....####.............#",

"#......................#",

"########################"

];


const MW=map[0].length;
const MH=map.length;



/* =========================
   ИГРОК
========================= */

const player={

    x:2.5,
    y:2.5,

    angle:0

};


const FOV=Math.PI/3;

const playerRadius=.22;



/* =========================
   СТЕНЫ
========================= */

function isWall(x,y){

    const ix=Math.floor(x);
    const iy=Math.floor(y);

    if(
        ix<0 ||
        iy<0 ||
        ix>=MW ||
        iy>=MH
    ){
        return true;
    }

    return map[iy][ix]==="#";
}



/* =========================
   СТОЛКНОВЕНИЯ
========================= */

function canMove(x,y){

    const r=playerRadius;

    return (

        !isWall(x-r,y-r) &&
        !isWall(x+r,y-r) &&
        !isWall(x-r,y+r) &&
        !isWall(x+r,y+r) &&

        !isWall(x,y-r) &&
        !isWall(x,y+r) &&
        !isWall(x-r,y) &&
        !isWall(x+r,y)

    );

}


function movePlayer(dx,dy){

    const nx=
        player.x+dx;

    const ny=
        player.y+dy;


    /* X отдельно */

    if(
        canMove(nx,player.y)
    ){

        player.x=nx;

    }


    /* Y отдельно */

    if(
        canMove(player.x,ny)
    ){

        player.y=ny;

    }

}



/* =========================
   ДЖОЙСТИК
========================= */

const joy=
document.getElementById("joy");

const knob=
document.getElementById("knob");


let joyID=null;

let joyX=0;
let joyY=0;


function updateJoystick(touch){

    const rect=
        joy.getBoundingClientRect();


    const centerX=
        rect.left+
        rect.width/2;

    const centerY=
        rect.top+
        rect.height/2;


    let dx=
        touch.clientX-centerX;

    let dy=
        touch.clientY-centerY;


    const max=
        rect.width/2-38;


    const distance=
        Math.hypot(dx,dy);


    if(distance>max){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;

    }


    knob.style.transform=
        `translate(${dx}px,${dy}px)`;


    joyX=
        dx/max;

    joyY=
        dy/max;

}


joy.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        joyID=
            e.changedTouches[0]
             .identifier;

        updateJoystick(
            e.changedTouches[0]
        );

    },
    {passive:false}
);


joy.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();

        for(
            const touch
            of e.changedTouches
        ){

            if(
                touch.identifier===
                joyID
            ){

                updateJoystick(touch);

            }

        }

    },
    {passive:false}
);


function joystickEnd(e){

    for(
        const touch
        of e.changedTouches
    ){

        if(
            touch.identifier===
            joyID
        ){

            joyID=null;

            joyX=0;
            joyY=0;

            knob.style.transform=
                "translate(0,0)";

        }

    }

}


joy.addEventListener(
    "touchend",
    joystickEnd
);

joy.addEventListener(
    "touchcancel",
    joystickEnd
);



/* =========================
   ПОВОРОТ КАМЕРЫ
========================= */

const look=
document.getElementById("look");


let lookID=null;

let lastLookX=0;


look.addEventListener(
    "touchstart",
    function(e){

        if(lookID!==null)
            return;

        const touch=
            e.changedTouches[0];

        lookID=
            touch.identifier;

        lastLookX=
            touch.clientX;

    },
    {passive:true}
);


look.addEventListener(
    "touchmove",
    function(e){

        for(
            const touch
            of e.changedTouches
        ){

            if(
                touch.identifier===
                lookID
            ){

                const difference=
                    touch.clientX-
                    lastLookX;


                player.angle+=
                    difference*0.006;


                lastLookX=
                    touch.clientX;

            }

        }

    },
    {passive:true}
);


function lookEnd(e){

    for(
        const touch
        of e.changedTouches
    ){

        if(
            touch.identifier===
            lookID
        ){

            lookID=null;

        }

    }

}


look.addEventListener(
    "touchend",
    lookEnd
);

look.addEventListener(
    "touchcancel",
    lookEnd
);



/* =========================
   КЛАВИАТУРА
   (если открыть на ПК)
========================= */

const keys={};


window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);


window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);



/* =========================
   ГОРИЗОНТАЛЬНЫЙ ЭКРАН
========================= */

async function tryLandscape(){

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ){

            await document.documentElement
                .requestFullscreen();

        }

    }catch(error){}


    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation
                .lock("landscape");

        }

    }catch(error){}

}


document
.getElementById("rotate")
.addEventListener(
    "click",
    tryLandscape
);



/* =========================
   FULLSCREEN
========================= */

document
.getElementById("fs")
.addEventListener(
    "click",
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document.documentElement
                    .requestFullscreen();

            }else{

                await document
                    .exitFullscreen();

            }

        }catch(error){}


        try{

            if(
                screen.orientation &&
                screen.orientation.lock
            ){

                await screen.orientation
                    .lock("landscape");

            }

        }catch(error){}

    }
);



/* =========================
   СЛУЧАЙНАЯ ТЕКСТУРА
========================= */

function hash(n){

    n=(n<<13)^n;

    return 1-
    (
        (
            n*
            (
                n*n*15731+
                789221
            )+
            1376312589
        )
        &
        2147483647
    )
    /1073741824;

}



/* =========================
   ОТРИСОВКА
========================= */

function render(){

    const width=W;
    const height=H;


    /* =====================
       ПОТОЛОК
    ===================== */

    const ceiling=
        ctx.createLinearGradient(
            0,
            0,
            0,
            height*.52
        );


    ceiling.addColorStop(
        0,
        "#d9cf9d"
    );

    ceiling.addColorStop(
        1,
        "#9e915c"
    );


    ctx.fillStyle=ceiling;

    ctx.fillRect(
        0,
        0,
        width,
        height*.52
    );



    /* =====================
       ПОЛ
    ===================== */

    const floor=
        ctx.createLinearGradient(
            0,
            height*.48,
            0,
            height
        );


    floor.addColorStop(
        0,
        "#9c9165"
    );

    floor.addColorStop(
        1,
        "#554d35"
    );


    ctx.fillStyle=floor;

    ctx.fillRect(
        0,
        height*.48,
        width,
        height*.52
    );



    /* =====================
       RAYCASTING
    ===================== */

    const horizon=
        height*.50;


    const rays=
        Math.min(
            700,
            Math.max(
                360,
                Math.floor(width*.75)
            )
        );


    const columnWidth=
        width/rays;


    for(
        let rayNumber=0;
        rayNumber<rays;
        rayNumber++
    ){

        const screenPosition=
            (rayNumber+.5)/
            rays-
            .5;


        const rayAngle=
            player.angle+
            screenPosition*FOV;


        const rayX=
            Math.cos(rayAngle);

        const rayY=
            Math.sin(rayAngle);



        /* DDA */

        let mapX=
            Math.floor(player.x);

        let mapY=
            Math.floor(player.y);


        const deltaX=
            Math.abs(1/rayX);

        const deltaY=
            Math.abs(1/rayY);


        let stepX;
        let stepY;

        let sideDistanceX;
        let sideDistanceY;


        if(rayX<0){

            stepX=-1;

            sideDistanceX=
                (player.x-mapX)*
                deltaX;

        }else{

            stepX=1;

            sideDistanceX=
                (mapX+1-player.x)*
                deltaX;

        }


        if(rayY<0){

            stepY=-1;

            sideDistanceY=
                (player.y-mapY)*
                deltaY;

        }else{

            stepY=1;

            sideDistanceY=
                (mapY+1-player.y)*
                deltaY;

        }


        let side=0;

        let hit=false;


        for(
            let i=0;
            i<80;
            i++
        ){

            if(
                sideDistanceX<
                sideDistanceY
            ){

                sideDistanceX+=
                    deltaX;

                mapX+=stepX;

                side=0;

            }else{

                sideDistanceY+=
                    deltaY;

                mapY+=stepY;

                side=1;

            }


            if(
                mapX<0 ||
                mapY<0 ||
                mapX>=MW ||
                mapY>=MH
            ){

                hit=true;

                break;

            }


            if(
                map[mapY][mapX]==="#"
            ){

                hit=true;

                break;

            }

        }


        if(!hit)
            continue;



        /* Расстояние */

        let distance;


        if(side===0){

            distance=
                (
                    mapX-
                    player.x+
                    (1-stepX)/2
                )/rayX;

        }else{

            distance=
                (
                    mapY-
                    player.y+
                    (1-stepY)/2
                )/rayY;

        }


        distance=
            Math.max(
                .05,
                distance
            );


        /* Убираем искажение */

        const correctedDistance=
            distance*
            Math.cos(
                rayAngle-
                player.angle
            );


        /* Высота стены */

        const wallHeight=
            Math.min(
                height*1.8,
                height*.95/
                correctedDistance
            );


        const top=
            horizon-
            wallHeight/2;


        const bottom=
            horizon+
            wallHeight/2;



        /* =================
           ОСВЕЩЕНИЕ
        ================= */

        let brightness=
            Math.max(
                .18,
                1-
                correctedDistance/13
            );


        if(side)
            brightness*=.82;



        /* =================
           ТЕКСТУРА СТЕН
        ================= */

        const wallPosition=
            side===0

            ?

            player.y+
            distance*rayY

            :

            player.x+
            distance*rayX;


        const texture=
            Math.floor(
                (
                    wallPosition-
                    Math.floor(wallPosition)
                )*12
            );


        const noise=
            hash(
                mapX*97+
                mapY*193+
                texture*17
            )*7;


        let red=
            208*brightness+
            noise;


        let green=
            194*brightness+
            noise;


        let blue=
            112*brightness+
            noise;


        red=Math.max(
            35,
            Math.min(235,red)
        );

        green=Math.max(
            32,
            Math.min(225,green)
        );

        blue=Math.max(
            18,
            Math.min(150,blue)
        );


        ctx.fillStyle=
            `rgb(
                ${red|0},
                ${green|0},
                ${blue|0}
            )`;


        ctx.fillRect(
            rayNumber*columnWidth,
            top,
            columnWidth+1,
            bottom-top
        );



        /* Вертикальные швы обоев */

        if(texture===0){

            ctx.fillStyle=
                `rgba(
                    80,
                    65,
                    25,
                    ${.18*brightness}
                )`;


            ctx.fillRect(
                rayNumber*columnWidth,
                top,
                Math.max(
                    1,
                    columnWidth
                ),
                bottom-top
            );

        }



        /* Плинтус */

        ctx.fillStyle=
            `rgba(
                75,
                65,
                38,
                ${.45*brightness}
            )`;


        ctx.fillRect(
            rayNumber*columnWidth,
            bottom-wallHeight*.055,
            columnWidth+1,
            wallHeight*.055
        );

    }



    /* =====================
       ПЛИТКА ПОЛА
    ===================== */

    ctx.strokeStyle=
        "rgba(55,50,32,.20)";

    ctx.lineWidth=1;


    for(
        let distance=1;
        distance<18;
        distance++
    ){

        const y=
            horizon+
            (
                height-horizon
            )*
            (
                1-
                Math.exp(
                    -distance*.22
                )
            );


        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(width,y);

        ctx.stroke();

    }



    /* =====================
       ЛАМПЫ
    ===================== */

    const lamps=[

        [3.5,2.5],
        [8.5,2.5],
        [15.5,2.5],
        [20.5,2.5],

        [5.5,6.5],
        [12.5,6.5],
        [19.5,6.5],

        [4.5,11.5],
        [11.5,11.5],
        [18.5,11.5],

        [6.5,14.5],
        [14.5,14.5]

    ];


    for(
        const lamp
        of lamps
    ){

        const lx=lamp[0];
        const ly=lamp[1];


        const dx=
            lx-player.x;

        const dy=
            ly-player.y;


        const distance=
            Math.hypot(
                dx,
                dy
            );


        let angle=
            Math.atan2(
                dy,
                dx
            )-
            player.angle;


        angle=
            Math.atan2(
                Math.sin(angle),
                Math.cos(angle)
            );


        if(
            Math.abs(angle)>
            FOV*.72
        )
            continue;


        if(
            distance>
            16
        )
            continue;


        const screenX=
            width/2+
            (
                angle/FOV
            )*
            width;


        const screenY=
            height*.13+
            Math.min(
                height*.24,
                distance*5
            );


        const alpha=
            Math.max(
                0,
                .25-distance*.012
            );


        ctx.fillStyle=
            `rgba(
                255,
                249,
                205,
                ${alpha}
            )`;


        ctx.fillRect(
            screenX-18,
            screenY,
            36,
            5
        );


        ctx.fillStyle=
            `rgba(
                255,
                255,
                230,
                ${Math.min(
                    .95,
                    alpha*3
                )}
            )`;


        ctx.fillRect(
            screenX-11,
            screenY+1,
            22,
            2
        );

    }



    /* =====================
       ТЁМНЫЕ КРАЯ
    ===================== */

    const vignette=
        ctx.createRadialGradient(
            width/2,
            height*.5,
            Math.min(width,height)*.15,

            width/2,
            height*.5,
            Math.max(width,height)*.72
        );


    vignette.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    vignette.addColorStop(
        .72,
        "rgba(0,0,0,.08)"
    );


    vignette.addColorStop(
        1,
        "rgba(0,0,0,.48)"
    );


    ctx.fillStyle=vignette;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );



    /* =====================
       ПРИЦЕЛ
    ===================== */

    ctx.strokeStyle=
        "rgba(255,255,255,.55)";

    ctx.lineWidth=1;


    ctx.beginPath();

    ctx.moveTo(
        width/2-5,
        height/2
    );

    ctx.lineTo(
        width/2+5,
        height/2
    );


    ctx.moveTo(
        width/2,
        height/2-5
    );

    ctx.lineTo(
        width/2,
        height/2+5
    );


    ctx.stroke();

}



/* =========================
   ИГРОВОЙ ЦИКЛ
========================= */

let lastTime=
    performance.now();


function gameLoop(time){

    const deltaTime=
        Math.min(
            .04,
            (time-lastTime)/1000
        );


    lastTime=time;



    /* Движение */

    let forward=
        -joyY;

    let strafe=
        joyX;



    /* Клавиатура */

    if(
        keys["w"] ||
        keys["arrowup"]
    )
        forward=1;


    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        forward=-1;


    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        strafe=-1;


    if(
        keys["d"] ||
        keys["arrowright"]
    )
        strafe=1;



    /* Поворот ПК */

    if(keys["q"])
        player.angle-=
            deltaTime*2.2;


    if(keys["e"])
        player.angle+=
            deltaTime*2.2;



    /* Скорость */

    const speed=2.5;



    const dx=
        (
            Math.cos(player.angle)*
            forward

            -

            Math.sin(player.angle)*
            strafe

        )*
        speed*
        deltaTime;


    const dy=
        (
            Math.sin(player.angle)*
            forward

            +

            Math.cos(player.angle)*
            strafe

        )*
        speed*
        deltaTime;



    movePlayer(
        dx,
        dy
    );



    /* Рисуем */

    render();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
